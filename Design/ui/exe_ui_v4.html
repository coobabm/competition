<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>len.exe 界面设计稿 v4</title>
<style>
:root{
  color-scheme:dark;
  --bg:#06080C;
  --g1:rgba(255,255,255,.035); --g2:rgba(255,255,255,.06); --g3:rgba(255,255,255,.10);
  --hair:rgba(255,255,255,.07); --hair2:rgba(255,255,255,.13);
  --ink:#F2F4F7; --ink2:rgba(232,238,244,.62); --ink3:rgba(232,238,244,.34);
  --mint:#5FE3B5; --mint2:#22A37C; --pur:#A594FF; --blu:#6AB8FF; --amb:#F2C46D; --red:#FF7A6E;
  --ui:"HarmonyOS Sans SC","MiSans","PingFang SC","Source Han Sans SC","Noto Sans SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  --num:"SF Pro Display","Inter","Segoe UI Variable Display","DIN Alternate","Bahnschrift","Segoe UI",sans-serif;
  --spring:cubic-bezier(.3,1.5,.5,1);
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#020305}
body{font-family:var(--ui);color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased;letter-spacing:.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid rgba(95,227,181,.7);outline-offset:2px}
input{font:inherit;color:var(--ink)}
.n{font-family:var(--num);font-variant-numeric:tabular-nums}
.amb{color:var(--amb)} .grn{color:var(--mint)} .red{color:var(--red)} .blu{color:var(--blu)} .dim{color:var(--ink3)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* press feel: spring scale on every control */
.btn2,.tab,.job,.yn,.op4 button,.lro,.seg button,.eq,.bbtn,.schip,.sub9 button,.exam,.tgl,.zm button,.drow button,.book .btn2,.talk,.px{transition:transform .22s var(--spring),background-color .15s,box-shadow .15s,color .15s}
.btn2:active:not(:disabled),.tab:active:not(:disabled),.job:active,.yn:active,.op4 button:active,.lro:active,.seg button:active,.eq:active,.bbtn:active:not(:disabled),.schip:active,.sub9 button:active,.exam:active,.tgl:active,.zm button:active,.drow button:active:not(:disabled),.talk:active,.px:active{transform:scale(.95);transition-duration:.06s}
.tbtn:active{transform:scale(.985)}
.pressfx{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%);transform:translate(-50%,-50%) scale(.2);animation:pfx .45s ease-out forwards;z-index:60}
@keyframes pfx{to{transform:translate(-50%,-50%) scale(1);opacity:0}}

#stage{position:absolute;left:50%;top:50%;width:1600px;height:960px;overflow:hidden;transform-origin:center center;
  background:radial-gradient(50% 40% at 72% 8%,rgba(150,215,245,.38),transparent 70%),repeating-linear-gradient(102deg,rgba(255,255,255,.03) 0 26px,transparent 26px 88px),linear-gradient(180deg,#2f7fb0,#165a86 45%,#0a2f4d)}
.dicons{position:absolute;left:10px;top:20px;display:grid;gap:22px;z-index:1}
.dico{width:96px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font:13px "Microsoft YaHei",sans-serif;text-shadow:0 1px 3px #000;padding:4px;border:1px solid transparent;border-radius:3px}
.dico:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25)}
.dico svg{width:48px;height:48px}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(rgba(60,100,140,.9),rgba(18,40,64,.97));border-top:1px solid rgba(255,255,255,.3);display:flex;align-items:center;gap:6px;padding:0 10px;color:#e6eef7;font:12px "Segoe UI","Microsoft YaHei",sans-serif;z-index:12}
.taskbar .start{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#9cd8ff,#2470b8 60%,#0c3d6e);box-shadow:0 0 8px rgba(140,200,255,.6)}
.taskbar .tk{min-width:56px;height:38px;padding:0 10px;border-radius:4px;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#e6eef7}
.taskbar .tk.on{background:rgba(255,255,255,.22)}
.taskbar .tk.blink{animation:tkb .8s ease-in-out 4}
@keyframes tkb{50%{background:rgba(255,170,60,.6)}}
.taskbar .ready{margin-left:auto;display:flex;align-items:center;gap:6px;margin-right:18px}
.taskbar .ready i{width:8px;height:8px;border-radius:50%;background:#4be08f}
.taskbar .clk{text-align:center;line-height:1.3;font-size:13px}

/* ===== exe window ===== */
.win{position:absolute;left:118px;top:8px;width:1474px;height:898px;display:grid;grid-template-rows:32px 84px 1fr;z-index:3;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 24px 70px rgba(0,0,0,.6);
  background:radial-gradient(900px 520px at 12% -12%,rgba(95,227,181,.09),transparent 70%),radial-gradient(900px 560px at 100% -10%,rgba(165,148,255,.08),transparent 70%),radial-gradient(1200px 700px at 60% 120%,rgba(106,184,255,.05),transparent 70%),var(--bg)}
.tbar{display:flex;align-items:center;gap:10px;padding:0 4px 0 16px;font-size:12px;color:var(--ink3)}
.tbar .dot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint)}
.tbar b{color:var(--ink2);font-weight:500}
.tbar .ctl{margin-left:auto;display:flex}
.tbar .ctl span{width:42px;height:28px;display:grid;place-items:center;color:var(--ink3)}
.hud{display:grid;grid-template-columns:230px 1fr auto auto auto;align-items:center;gap:40px;padding:0 30px 0 26px}
.me{display:flex;align-items:center;gap:14px}
.orb{width:46px;height:46px;border-radius:50%;flex:none;background:radial-gradient(circle at 36% 30%,#f2fff9 0,#8ff0c8 14%,#2fb38a 44%,#0b3a2c 78%,#02120c 100%);box-shadow:0 0 28px rgba(95,227,181,.38),0 0 0 1px rgba(255,255,255,.08)}
.orb.pulse{animation:opulse .5s ease-out}
@keyframes opulse{40%{transform:scale(1.12);box-shadow:0 0 40px rgba(95,227,181,.7)}}
.me b{display:block;font-size:19px;font-weight:600;letter-spacing:.02em}
.me small{color:var(--ink3);font-size:12px}
.hbt{font-size:12px;color:var(--ink3);margin-bottom:8px}
.hbt b{color:var(--ink);font-weight:600;font-size:13px;margin-left:4px}
.hbr{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.mb{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;font-size:12px;color:var(--ink3)}
.mt{height:5px;border-radius:3px;background:rgba(255,255,255,.07);position:relative;overflow:hidden;display:block}
.mt i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
i.pur{background:linear-gradient(90deg,#7F6BFF,#C8BEFF)} i.blu{background:linear-gradient(90deg,#3E95F0,#A9D6FF)} i.mnt{background:linear-gradient(90deg,#22A37C,#8ff0c8)}
.mv{color:var(--ink2);font-size:13px}
.slots{display:flex;align-items:center;gap:6px}
.slots i{width:30px;height:30px;border-radius:9px;background:var(--g1);display:grid;place-items:center;font-style:normal;font-size:12px;color:var(--ink3);box-shadow:inset 0 0 0 1px var(--hair)}
.slots i.on{background:rgba(106,184,255,.16);color:#cfe6ff;font-weight:600;box-shadow:inset 0 0 0 1px rgba(106,184,255,.35)}
.led{display:flex;gap:30px}
.led div{text-align:right}
.led small,.dt small{display:block;font-size:11px;color:var(--ink3);margin-bottom:2px}
.led b{font-size:22px;font-weight:300;letter-spacing:-.01em}
.dt{text-align:right} .dt b{font-size:15px;font-weight:400;color:var(--ink2)}
.schip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;background:var(--g1);box-shadow:inset 0 0 0 1px var(--hair);color:var(--ink3);font-size:12px}
.schip b{color:var(--ink2);font-weight:500}
.schip .n{color:var(--amb)}
.schip:hover{background:var(--g2)}
.schip svg{width:13px;height:13px}

/* narrow sidebar, four tabs share the height evenly */
.body{display:grid;grid-template-columns:112px 1fr;min-height:0}
.pet{border-radius:16px;background:var(--g1);box-shadow:inset 0 0 0 1px var(--hair);padding:10px 6px 8px;display:grid;justify-items:center;gap:6px;text-align:center}
.pet .pi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.05);color:var(--ink2);transition:transform .3s var(--spring)}
.pet.out .pi{color:var(--amb);background:rgba(242,196,109,.12);transform:translateY(-2px)}
.pet .pi svg{width:20px;height:20px}
.pet small{font-size:10px;color:var(--ink3);line-height:1.3}
.pet button{width:100%;height:26px;border-radius:999px;background:var(--g2);font-size:11px;color:var(--ink);transition:transform .22s var(--spring),background-color .15s}
.pet button:active{transform:scale(.94)}
.side{display:grid;grid-template-rows:1fr auto auto;gap:12px;padding:4px 10px 14px 12px;min-height:0}
.tabs{display:grid;grid-template-rows:repeat(4,1fr);gap:8px;min-height:0}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:22px;font-size:15px;font-weight:500;color:var(--ink2);text-align:center;padding:8px 4px}
.tab .ti{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 6px 16px rgba(0,0,0,.35);transition:transform .25s var(--spring)}
.tab .ti svg{width:22px;height:22px}
.tab.on{background:var(--g3);color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair)}
.tab.on .ti{transform:scale(1.06)}
.tab:not(.lock):not(.on):hover{background:var(--g1)}
.tab .cnt{position:absolute;top:calc(50% - 46px);right:18px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--amb);color:#1a1205;font-size:11px;font-weight:700;font-family:var(--num);display:grid;place-items:center}
.tab.lock{color:var(--ink3)}
.tab.lock .ti{background:rgba(255,255,255,.05)!important;color:var(--ink3);box-shadow:inset 0 0 0 1px var(--hair)}
.tab .tw{font-size:11px;line-height:1.45;color:var(--ink3);font-weight:400;max-width:80px}
.side .tog{display:flex;justify-content:center;gap:8px}
.side .tog button{width:38px;height:38px;border-radius:50%;background:var(--g1);color:var(--ink3);display:grid;place-items:center}
.side .tog button.on{color:var(--ink)}
.side .tog svg{width:16px;height:16px}

main{position:relative;min-width:0;min-height:0}
.page{position:absolute;inset:0;display:none;min-height:0;padding:4px 22px 20px 6px}
.page.on{display:grid;animation:pgin .26s cubic-bezier(.2,.8,.2,1)}
@keyframes pgin{from{opacity:0;transform:translateY(8px)}}
.pn{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.018));border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--hair),inset 0 1px 0 rgba(255,255,255,.04);position:relative;min-height:0;min-width:0;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;height:48px;padding:0 20px;font-size:12px;color:var(--ink3)}
.ph b{color:var(--ink);font-size:15px;font-weight:600}
.ph .r{margin-left:auto}
.btn2{height:30px;padding:0 14px;border-radius:999px;background:var(--g2);font-size:12px;color:var(--ink);white-space:nowrap}
.btn2:hover{background:var(--g3)}
.btn2:disabled{color:var(--ink3);background:var(--g1)}

.seal{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:12px;cursor:pointer;color:var(--ink3);overflow:hidden;border-radius:inherit;background:rgba(255,255,255,.012)}
.seal::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 60%,rgba(95,227,181,.07) 70%,rgba(165,148,255,.07) 80%,transparent 90%);animation:spin 14s linear infinite}
.seal::after{content:"";position:absolute;inset:1px;border-radius:inherit;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 22px),rgba(8,11,16,.78)}
.seal>*{position:relative;z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
.seal .lk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--g1);box-shadow:inset 0 0 0 1px var(--hair2);color:var(--ink2);transition:color .15s,box-shadow .15s,transform .25s var(--spring)}
.seal .lk svg{width:14px;height:14px}
.seal b{font-size:15px;color:var(--ink);font-weight:600;letter-spacing:.04em}
.seal p{font-size:12px;max-width:24em;line-height:1.6}
.seal .p{font-family:var(--num);color:var(--amb);font-size:13px;padding:3px 12px;border-radius:999px;background:rgba(242,196,109,.1)}
.seal .p.l{color:var(--ink3);background:var(--g1);font-family:var(--ui);font-size:12px}
.seal:hover .lk{color:var(--mint);box-shadow:inset 0 0 0 1px rgba(95,227,181,.5);transform:scale(1.08)}
.seal.row{flex-direction:row;gap:16px;justify-content:flex-start;padding:0 22px}
.seal.row p{text-align:left}
.seg{display:flex;gap:2px;padding:3px;border-radius:12px;background:rgba(255,255,255,.05)}
.seg button{flex:1;white-space:nowrap;height:30px;border-radius:9px;font-size:12px;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:5px}
.seg button.on{background:rgba(255,255,255,.14);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.seg button svg{width:11px;height:11px}

/* 教 */
#p-teach{grid-template-columns:270px 1fr 330px;gap:16px}
.hl{padding:0 10px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto;height:calc(100% - 48px)}
.job{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:12px;text-align:left}
.job:hover{background:var(--g1)}
.job.on{background:var(--g3)}
.job .ji{width:36px;height:36px;border-radius:10px;background:rgba(95,227,181,.12);display:grid;place-items:center;color:var(--mint)}
.job .jn{font-size:14px;min-width:0}
.job small{display:block;color:var(--ink3);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .jp{color:var(--amb);font-size:13px}
.job.lockd{opacity:.55}
.job.lockd .ji{color:var(--ink3);background:var(--g1)}
.qp{display:grid;grid-template-rows:56px 1fr auto 48px}
.qh{display:flex;align-items:center;gap:12px;padding:0 26px;font-size:13px;color:var(--ink3)}
.qh b{color:var(--ink);font-size:15px;font-weight:600}
.qh .r{margin-left:auto;display:flex;align-items:baseline;gap:8px}
.qh .combo{font-family:var(--num);font-size:30px;color:var(--ink);font-weight:200;display:inline-block}
.qh .combo.bump{animation:bump .35s var(--spring)}
@keyframes bump{40%{transform:scale(1.35);color:var(--mint)}}
.qh .mult{color:var(--amb);font-family:var(--num);font-size:13px}
.qc{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:22px;min-height:0;animation:qin .25s cubic-bezier(.2,.8,.2,1)}
@keyframes qin{from{opacity:0;transform:translateX(14px)}}
.qt{font-size:40px;font-weight:600;text-align:center;max-width:16em;line-height:1.3;letter-spacing:.02em}
.pg{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink2);min-height:22px}
.pg .po{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#e5fff5,#2fb38a);box-shadow:0 0 8px rgba(95,227,181,.6)}
.pg b{color:var(--ink);font-weight:500}
.pg .n{color:var(--ink3);font-size:13px}
.qa2{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 40px 22px}
.yn{height:112px;border-radius:24px;font-size:40px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:14px}
.yn.y{color:var(--mint);background:rgba(95,227,181,.08);box-shadow:inset 0 0 0 1px rgba(95,227,181,.22)}
.yn.x{color:var(--red);background:rgba(255,122,110,.07);box-shadow:inset 0 0 0 1px rgba(255,122,110,.2)}
.yn.y:hover{background:rgba(95,227,181,.14)} .yn.x:hover{background:rgba(255,122,110,.12)}
.yn.ok{background:rgba(95,227,181,.3)!important} .yn.no{background:rgba(255,122,110,.3)!important;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
kbd{font-family:var(--num);font-size:11px;font-weight:400;opacity:.45;padding:1px 6px;border-radius:5px;box-shadow:inset 0 0 0 1px currentColor}
.op4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 40px 22px}
.op4 button{height:76px;border-radius:20px;font-size:28px;font-weight:500;background:var(--g1);box-shadow:inset 0 0 0 1px var(--hair2);display:flex;align-items:center;justify-content:center;gap:10px}
.op4 button:hover{background:var(--g2)}
.op4 button.ok{background:rgba(95,227,181,.3)} .op4 button.no{background:rgba(255,122,110,.3);animation:shake .3s}
.digit{width:200px;height:200px;border-radius:20px;background:#030507;box-shadow:inset 0 0 0 1px var(--hair)}
.g9{display:grid;grid-template-columns:repeat(3,108px);gap:8px}
.tile9{height:108px;border-radius:16px;background:#030507;box-shadow:inset 0 0 0 1px var(--hair);display:grid;place-items:center;position:relative;transition:transform .2s var(--spring)}
.tile9:active{transform:scale(.95)}
.tile9 svg{width:62px;height:62px;stroke:#d8e4ea;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tile9.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.tile9.ai::before{content:"";position:absolute;left:9px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 6px var(--mint)}
.tile9.hit{box-shadow:inset 0 0 0 2px var(--mint)} .tile9.miss{box-shadow:inset 0 0 0 2px var(--red)}
.sub9{display:flex;justify-content:center;padding:0 0 22px}
.sub9 button{height:46px;padding:0 44px;border-radius:999px;background:var(--ink);color:#06080c;font-size:15px;font-weight:600}
.qf{display:flex;gap:16px;align-items:center;padding:0 26px;font-size:12px;color:var(--ink3);border-top:1px solid var(--hair)}
.qf .r{margin-left:auto}
.fb.good{color:var(--mint)} .fb.bad{color:var(--red)}
.float{position:absolute;font-family:var(--num);font-size:18px;font-weight:600;pointer-events:none;z-index:30;animation:up .9s ease-out forwards}
@keyframes up{to{transform:translateY(-36px);opacity:0}}
.hist{display:grid;grid-template-rows:48px 46px 1fr}
.hist .seg{margin:0 14px 10px}
.hlist{overflow:auto;padding:0 8px 10px}
.he{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:12px;transition:background-color .15s}
.he:hover{background:var(--g1)}
.he.open{background:var(--g2)}
.he .t1{display:grid;grid-template-columns:16px 1fr auto;gap:10px;align-items:start;font-size:13px}
.he .mk{font-weight:700;line-height:1.45}
.he .q{line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.he.open .q{white-space:normal}
.he .tm{font-size:11px;color:var(--ink3);font-family:var(--num)}
.he .t2{margin:3px 0 0 26px;font-size:12px;color:var(--ink3);display:flex;gap:12px}
.he .det{display:none;margin:10px 0 2px 26px;font-size:12px;line-height:1.75;color:var(--ink2)}
.he.open .det{display:block;animation:pgin .2s ease-out}
.det .kv{display:grid;grid-template-columns:64px 1fr;gap:2px 10px}
.det .kv span:nth-child(odd){color:var(--ink3)}
.det .ex{margin-top:8px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.04);color:var(--ink)}
.det .thumb{float:right;width:46px;height:46px;margin-left:8px;border-radius:10px;background:#030507;display:grid;place-items:center}
.det .thumb svg{width:30px;height:30px;stroke:#d8e4ea;fill:none;stroke-width:3}
.hempty{padding:40px 16px;color:var(--ink3);font-size:12px;line-height:1.8;text-align:center}

/* 练 */
#p-train{grid-template-columns:480px 1fr;gap:16px}
.lcol,.rcol{display:grid;gap:16px;min-height:0}
.lcol{grid-template-rows:232px 1fr 176px}
.rcol{grid-template-rows:52px 1fr 66px 118px}
.abb{padding:0 20px 16px;display:grid;gap:12px}
.bb .top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink3)}
.bb .top b{font-family:var(--num);color:var(--ink);font-size:20px;font-weight:300}
.bb .top b small{font-size:13px;color:var(--ink3);margin-left:2px}

function caps(){
 const p=params(),np=NEEDP[S.stage]||p,d=effSamples(),nd=NEEDD[S.stage]||d;
 const T=Math.min(99,62+4*S.stage+12*Math.min(1,p/Math.max(np,.1)));
 const gap=Math.max(2.5,20-14*Math.min(1,d/Math.max(nd,1))-(lv('dropout')?5:0)-(lv('aug')?3:0));
 return {T,V:T-gap};
}
const last=a=>a[a.length-1];
function trainRound(quiet){
 const {T,V}=caps(),L=LRS[S.lr];
 const t=last(S.tr)??50,v=last(S.va)??45;
 const blow=Math.random()<L.blow*(lv('bn')?.4:1);
 let nt=blow?t-rnd(6,12):t+(T-t)*L.k*rnd(.6,1.25)+rnd(-.8,.8);
 let nv=blow?v-rnd(6,12):v+(V-v)*L.k*rnd(.5,1.15)+rnd(-1.2,1.2);
 if(!blow&&Math.random()<L.back) nv-=rnd(2,5);
 nt=Math.max(30,Math.min(99.5,nt));nv=Math.max(25,Math.min(nt,nv));
 if(nv<v-1) S.marks.push(S.tr.length);
 S.tr.push(nt);S.va.push(nv);S.round++;
 S.lastDelta=Math.round((nv-v)*10);
 if(nv>S.best){S.best=nv;S.ckpt={len:S.tr.length};}
 if(!quiet){
  const cost=(lv('cudnn')?.7:1)*(1.2+S.stage*.6);
  S.money-=cost;log('训练电费',-cost,'电费');
  const pool=Q[S.bank]||Q.sense;
  S.sheet=[0,1,2,3].map(i=>{const q=pool[(S.round*3+i)%pool.length];const ok=Math.random()<nv/100;return {q:q[0],ans:ok?q[1]:!q[1],ok};});
  if(blow){toast('这一轮练崩了，成绩掉了一截');snd('no');}else snd('done');
 }
 return blow;
}

  if(i<6) w+=`<span class="arrow" style="left:${x+COLW-38}px;top:72px">›</span>`;}
 BRN.forEach((b,i)=>{w+=`<div class="band" style="top:${ROW0+i*ROWH-16}px;width:${X0+6*COLW}px"></div><div class="brl" style="top:${ROW0+i*ROWH}px">${b}</div>`;});
 let e='';NODES.forEach(n=>(n.d||[]).forEach(d=>{const a=npos(NODE[d]),z=npos(n);const ax=a.x+64,ay=a.y+25,zx=z.x+14,zy=z.y+25;const mx=zx-14;

 w+=`<svg class="edges" width="${X0+6*COLW}" height="${ROW0+BRN.length*ROWH}">${e}</svg>`;
 NODES.forEach(n=>{const p=npos(n),st=nodeState(n),L=lv(n.id),M=maxLv(n);
  const pr=st.s==='max'?'✓':st.s==='chat'?'说一句话':st.s==='lock'&&n.st>S.stage?'能力 '+n.st:'¥'+fmtN(price(n));

function popHTML(n){

 const cd=st.s!=='max'?(n.lvC?n.lvC[L]:n.cond):null;if(cd)reqs+=`<li class="${S.cond[cd]?'y':'x'}">${S.cond[cd]?'✓':'✗'}　${COND[cd]}</li>`;
 if(n.side)reqs+=`<li class="x">支线：不买也不影响主线</li>`;
 if(st.s!=='max'){const ns=n.lvSt?n.lvSt[L]:n.st;reqs+=`<li class="${ns<=S.stage?'y':'x'}">${ns<=S.stage?'✓':'✗'}　能力 ${ns}</li>`;if(!n.chat)reqs+=`<li class="${S.money>=p?'y':'x m'}">${S.money>=p?'✓':'✗'}　经费 ¥${fmtN(p)}</li>`;}
 const lvls=n.lvSt?`<div class="lvls">${n.lvSt.map((s,i)=>`<span class="${i<L?'got':''}${i===L?' nx':''}">${n.lvL?n.lvL[i]:n.id==='width'?fmtK(WID[i]):LAY[i]+' 层'}<small>能力 ${s}</small></span>`).join('')}</div>`:'';
 const lbl={max:'已拥有',can:`买下　¥${fmtN(p)}`,poor:`钱不够　¥${fmtN(p)}`,lock:st.why,chat:'去 YY 对它说一句话'}[st.s];
 return `<div class="pt"><span class="ptile">${ic(n.ic)}</span><div><b>${n.n}</b><small>${BRN[n.br]}　${M>1?`Lv ${L} / ${M}`:L?'已拥有':'还没有'}</small></div><button class="px" id="popX">×</button></div>
 <p class="one">${n.one}</p><div class="eff"><span>买下以后</span>${n.eff.replace('{名字}',esc(S.name))}</div>
 ${n.raw?`<p class="raw">${n.raw.replace(/【(.+?)】/g,'<em>$1</em>')}</p>`:''}${lvls}
 ${n.chat&&!L?`<p class="raw">对它说：「${n.chat.replace(/[^？?]/g,'＿')}」<br>原句藏在贴吧楼层和书页批注里。</p>`:''}
 <ul class="req">${reqs}</ul><button class="bbtn s-${st.s}" id="popBuy" data-quiet="1" ${st.s==='can'?'':'disabled'}>${lbl}</button>`;
}
function showPop(id){const pop=$('#pop');if(!pop)return;pop.innerHTML=popHTML(NODE[id]);pop.classList.remove('on');void pop.offsetWidth;pop.classList.add('on');placePop();
 $('#popX').onclick=e=>{e.stopPropagation();S.sel=null;pop.classList.remove('on');$$('.nd.sel').forEach(x=>x.classList.remove('sel'));};

function placePop(){const pop=$('#pop'),map=$('#map');if(!pop||!S.sel)return;const el=$(`.nd[data-id="${S.sel}"] .tile`);if(!el)return;
 const m=map.getBoundingClientRect(),r=el.getBoundingClientRect();const mw=map.clientWidth,mh=map.clientHeight;
 let x=(r.right-m.left)/SCALE+16,y=(r.top-m.top)/SCALE-14;if(x+320>mw-10)x=(r.left-m.left)/SCALE-336;x=Math.max(10,x);
 y=Math.max(10,Math.min(mh-pop.offsetHeight-10,y));pop.style.left=x+'px';pop.style.top=y+'px';}
let vraf=0;function applyView(){const w=$('#world');if(!w)return;w.style.transform=`translate(${V.x}px,${V.y}px) scale(${V.k})`;const zp=$('#zp');if(zp)zp.textContent=Math.round(V.k*100)+'%';if($('#pop')?.classList.contains('on'))placePop();}
const sched=()=>{if(!vraf)vraf=requestAnimationFrame(()=>{vraf=0;applyView();});};
function zoomAt(k,cx,cy){k=Math.max(.5,Math.min(1.5,k));V.x=cx-(cx-V.x)*k/V.k;V.y=cy-(cy-V.y)*k/V.k;V.k=k;sched();}
function fit(){const m=$('#map');if(!m)return;const W=X0+6*COLW+20,H=ROW0+BRN.length*ROWH;V.k=Math.max(.5,Math.min(1.5,Math.min(m.clientWidth/W,m.clientHeight/H)));V.x=(m.clientWidth-W*V.k)/2;V.y=(m.clientHeight-H*V.k)/2;applyView();}
function centerNode(id){requestAnimationFrame(()=>{const m=$('#map');if(!m)return;const p=npos(NODE[id]);if(V.k<.8)V.k=.9;V.x=m.clientWidth/2-170-(p.x+39)*V.k;V.y=m.clientHeight/2-(p.y+25)*V.k;applyView();showPop(id);});}
function bindMap(){
 const map=$('#map');let drag=null,moved=false;
 map.addEventListener('pointerdown',e=>{if(e.target.closest('.nd,.pop'))return;drag={x:e.clientX,y:e.clientY};moved=false;map.classList.add('drag');map.setPointerCapture(e.pointerId);});
 map.addEventListener('pointermove',e=>{if(!drag)return;const dx=(e.clientX-drag.x)/SCALE,dy=(e.clientY-drag.y)/SCALE;if(Math.abs(dx)+Math.abs(dy)>1)moved=true;V.x+=dx;V.y+=dy;drag={x:e.clientX,y:e.clientY};sched();});
 map.addEventListener('pointerup',()=>{if(!drag)return;drag=null;map.classList.remove('drag');if(!moved){S.sel=null;$('#pop').classList.remove('on');$$('.nd.sel').forEach(x=>x.classList.remove('sel'));}});
 map.addEventListener('wheel',e=>{e.preventDefault();const r=map.getBoundingClientRect();zoomAt(V.k*(e.deltaY<0?1.12:1/1.12),(e.clientX-r.left)/SCALE,(e.clientY-r.top)/SCALE);},{passive:false});
 map.addEventListener('dblclick',e=>{if(e.target.closest('.nd,.pop'))return;const r=map.getBoundingClientRect();zoomAt(1,(e.clientX-r.left)/SCALE,(e.clientY-r.top)/SCALE);});
 $$('#map .nd').forEach(b=>b.addEventListener('click',()=>{S.sel=b.dataset.id;$$('.nd.sel').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');showPop(S.sel);}));
 const mid=()=>[map.clientWidth/2,map.clientHeight/2];
 $('#zi').onclick=()=>zoomAt(V.k+.1,...mid());$('#zo').onclick=()=>zoomAt(V.k-.1,...mid());$('#zf').onclick=fit;
 $('#onlyCan').onclick=()=>{S.onlyCan=!S.onlyCan;tech();};
 $('#atlasBtn').onclick=()=>openAtlas(S.stage);
 $$('.sj button').forEach(b=>b.onclick=()=>{const i=+b.dataset.col;V.x=map.clientWidth/2-(X0+(i-1)*COLW+COLW/2-30)*V.k;sched();});
}

function orb(){const c=$('#orbc');if(!c)return;const x=c.getContext('2d'),N=800,pts=[];for(let i=0;i<N;i++){const u=Math.random()*2-1,th=Math.random()*6.283,r=Math.sqrt(1-u*u);pts.push([r*Math.cos(th),u,r*Math.sin(th),Math.random()]);}
 let a=0;const f=()=>{if(!c.isConnected)return;const W=c.width,R=W*.33;x.clearRect(0,0,W,W);const lit=.2+S.stage*.13;
  for(const p of pts){const ca=Math.cos(a),sa=Math.sin(a),X=p[0]*ca-p[2]*sa,Z=p[0]*sa+p[2]*ca,Y=p[1],d=(Z+1)/2,on=p[3]<lit;
   x.fillStyle=on?`hsla(${155+X*30+Y*20},80%,${58+d*20}%,${.25+d*.75})`:`rgba(200,210,220,${.04+d*.12})`;x.beginPath();x.arc(W/2+X*R,W/2+Y*R,(on?2.6:1.5)*(.6+d*.9),0,7);x.fill();}
  a+=.003;if(!S.reduce)requestAnimationFrame(f);};f();}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function preset(s){
 S.lv={perceptron:1,width:1,depth:1,slots:1,sense:1};S.inst={sense:1};S.dl={};S.hist=[];S.log=[];S.feed=[];S.chat=[];S.combo=0;S.today=0;S.todayEarn=0;S.ckpt=null;S.qzRep='';S.sel=null;S.fb='';S.fbc='';S.read={};S.pendingAsk=null;S.fsel.clear();S.dataOpen=false;
 if(s===0){S.stage=1;S.money=0;S.samples=0;S.answered=0;S.round=0;S.tr=[];S.va=[];S.sheet=[];S.tab='teach';fitted=false;renderAll();go('teach');renderFolder();renderYY();return;}
 S.stage=s;
 NODES.forEach(n=>{if(n.chat||n.cond||n.from0)return;if(n.lvSt){S.lv[n.id]=Math.min(maxLv(n),n.lvSt.filter(x=>x<s).length+1);}else if(n.st<s)S.lv[n.id]=1;});
 for(let i=1;i<=s;i++)(PRESET_CORE[i]||[]).forEach(id=>{if(i<s||NODE[id].st<=s)S.lv[id]=1;});
 NODES.filter(n=>n.from0).forEach(n=>{let L=0;while(L<maxLv(n)&&n.lvSt[L]<s&&(n.lvD?.[L]||[]).every(d=>lv(d))&&!(n.lvC?.[L]&&!S.cond[n.lvC[L]]))L++;S.lv[n.id]=L;});
 if(s===1){S.lv={perceptron:1,width:1,depth:1,slots:1,sense:1,curve:1,ledger:1};}
 PACKS.forEach(n=>{if(lv(n.id)){S.dl[n.id]=1;S.inst[n.id]=1;}});
 // 留一个下载好但没装的包，方便试拖拽
 const spare=PACKS.find(n=>!lv(n.id)&&n.st<=s);if(spare){S.lv[spare.id]=1;S.dl[spare.id]=1;}
 S.money=[0,60,1366,3844,9000,26000,80000][s];S.samples=[0,300,2600,12000,45000,160000,650000][s];S.answered=s===1?14:200*s;
 S.round=10+8*s;S.lr=3;S.viz=Math.min(s,2);S.bank='sense';seedCurve();
 log('做题 · 常识判断',S.answered*30*.4,'题目');S.earnWin=[];

 if(!tabOpen(S.tab))S.tab='teach';fitted=false;renderAll();go(S.tab);renderFolder();renderYY();
}
