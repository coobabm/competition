<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的电脑活了 · 科技图标全图鉴</title><style>
:root{color-scheme:dark;font-family:system-ui,'Microsoft YaHei',sans-serif;background:#101b20;color:#dbe7e4}body{margin:0;padding:32px}header{max-width:1100px;margin:auto}h1{font-weight:550;letter-spacing:.04em;margin-bottom:10px}p{color:#9db4b6;line-height:1.7}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;position:sticky;top:0;background:#101b20ef;padding:16px 0;z-index:2}input,select{padding:10px;border:1px solid #456165;border-radius:5px;background:#182a30;color:inherit}input[type=search]{min-width:260px}.stats{font:13px monospace;color:#81c8be}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:12px;max-width:1400px;margin:24px auto}.card{font:inherit;color:inherit;background:#19292e;border:1px solid #32484e;border-radius:8px;padding:18px 12px;text-align:left;cursor:default;min-width:0}.card:focus-visible{outline:2px solid #8eddd0;outline-offset:3px}.card:hover{border-color:#7aaca7}.icon{width:96px;height:96px;position:relative;margin:0 auto 16px}.icon img,.icon svg{width:var(--icon-size,96px);height:var(--icon-size,96px);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}.card h2{font-size:14px;font-weight:550;line-height:1.5;margin:0 0 8px}.meta{font:11px monospace;color:#89a4a8;overflow-wrap:anywhere}.signal{opacity:0;stroke-dasharray:14 86;stroke-dashoffset:0}.signal.halo{opacity:0}.run .signal{animation:signal 2.6s linear infinite}.run .halo{animation:halo 2.6s linear infinite}@keyframes signal{0%{opacity:0;stroke-dashoffset:14}4%{opacity:1}34%{opacity:1}38.4615%{opacity:0;stroke-dashoffset:-100}100%{opacity:0;stroke-dashoffset:-100}}@keyframes halo{0%{opacity:0;stroke-dashoffset:14}4%{opacity:.12}34%{opacity:.12}38.4615%{opacity:0;stroke-dashoffset:-100}100%{opacity:0;stroke-dashoffset:-100}}.locked .icon{opacity:.35}.mystery .icon img,.mystery .icon svg{display:none}.mystery .icon:after{content:'?';display:grid;place-items:center;height:100%;font-size:54px;color:#8caaa9;border:1px dashed #3d5d60;border-radius:14px}.reduced .run .signal{animation:none;stroke-dasharray:none;opacity:.55}.reduced .run .halo{opacity:.12}@media(prefers-reduced-motion:reduce){.run .signal{animation:none;stroke-dasharray:none;opacity:.55}.run .halo{opacity:.12}}footer{max-width:1100px;margin:auto;color:#89a4a8;font-size:13px}button{touch-action:manipulation}
</style><header><div class="stats">MY COMPUTER IS ALIVE / TECH ICON ATLAS / REVIEW DRAFT</div><h1>一束信号，读懂一项技术</h1><p>全量科技节点设计图鉴 · 原图保留，光效只在图标内部流动。悬停或键盘聚焦查看，1 秒运行后停顿 1.6 秒。<br>设计者审阅模式包含隐藏科技名称与图案，存在剧透；神秘状态示例会隐藏名称。</p><div class="toolbar"><input id="search" type="search" placeholder="搜索名称、ID、entry" aria-label="搜索图标"><select id="family" aria-label="按语义分类"><option value="">全部语义分类</option></select><select id="state" aria-label="图标状态"><option value="available">已发现</option><option value="locked">锁定 · 降亮</option><option value="mystery">神秘 · 问号</option></select><select id="size" aria-label="图标尺寸"><option value="24">24 px</option><option value="32">32 px</option><option value="48">48 px</option><option value="96" selected>96 px</option></select><label><input id="reduce" type="checkbox">减少动画</label></div><div id="stats" class="stats" aria-live="polite"></div></header><main id="grid"></main><footer>设计交接稿，不是 Unity 运行组件。现有 PNG 的素材授权沿用项目；新增 SVG 为本稿几何绘制，无外部素材。完整参数与来源见 manifest.json。</footer><script>
const manifest=__MANIFEST__;
const overlays=__OVERLAYS__;
const grid=document.querySelector('#grid'),search=document.querySelector('#search'),family=document.querySelector('#family'),state=document.querySelector('#state'),reduce=document.querySelector('#reduce');
for(const f of [...new Set(manifest.nodes.map(n=>n.family))].sort()){let o=document.createElement('option');o.value=f;o.textContent=f;family.append(o)}
function render(){grid.replaceChildren();const term=search.value.trim().toLowerCase();const nodes=manifest.nodes.filter(n=>(!family.value||n.family===family.value)&&(!term||`${n.id} ${n.entry} ${n.name}`.toLowerCase().includes(term)));for(const n of nodes){const b=document.createElement('button');b.className=`card ${state.value}${reduce.checked?' reduced':''}`;b.type='button';b.dataset.id=n.id;b.setAttribute('aria-label',state.value==='mystery'?'未发现的科技':`${n.name}，${n.animation}`);const icon=document.createElement('div');icon.className='icon';const img=document.createElement('img');img.src=n.base;img.alt='';img.loading='lazy';icon.append(img);icon.insertAdjacentHTML('beforeend',overlays[n.id]);b.append(icon);const title=document.createElement('h2');title.textContent=state.value==='mystery'?'未发现的线索':n.name;b.append(title);const meta=document.createElement('div');meta.className='meta';meta.textContent=state.value==='mystery'?'?':`${n.id} · ${n.family}`;b.append(meta);b.title=state.value==='mystery'?'发现后查看':`${n.animation}\n${n.sourceType}\nentry: ${n.entry}`;const start=()=>{document.querySelectorAll('.run').forEach(x=>x.classList.remove('run'));if(state.value!=='mystery'&&!document.hidden)b.classList.add('run')};const stop=()=>b.classList.remove('run');b.addEventListener('pointerenter',start);b.addEventListener('focus',start);b.addEventListener('pointerleave',stop);b.addEventListener('blur',stop);grid.append(b)}document.querySelector('#stats').textContent=`${nodes.length} / ${manifest.nodeCount} 节点 · ${manifest.entryCount} entry · ${new Set(manifest.nodes.map(n=>n.family)).size} 语义类别 · 原始 PNG ${manifest.nodes.filter(n=>n.sourceType==='project-original-png').length} · 新绘 SVG ${manifest.nodes.filter(n=>n.sourceType==='authored-semantic-svg').length}`}
document.querySelector('#size').addEventListener('change',e=>{document.documentElement.style.setProperty('--icon-size',e.target.value+'px')});search.addEventListener('input',render);family.addEventListener('change',render);state.addEventListener('change',render);reduce.addEventListener('change',render);document.addEventListener('visibilitychange',()=>document.querySelectorAll('.run').forEach(b=>b.classList.remove('run')));render();
</script></html>
