const grid=document.querySelector('#grid'),search=document.querySelector('#search'),family=document.querySelector('#family'),state=document.querySelector('#state'),reduce=document.querySelector('#reduce');
for(const f of [...new Set(manifest.nodes.map(n=>n.family))].sort()){let o=document.createElement('option');o.value=f;o.textContent=f;family.append(o)}
function render(){grid.replaceChildren();const term=search.value.trim().toLowerCase();const nodes=manifest.nodes.filter(n=>(!family.value||n.family===family.value)&&(!term||`${n.id} ${n.entry} ${n.name}`.toLowerCase().includes(term)));for(const n of nodes){const b=document.createElement('button');b.className=`card ${state.value}${reduce.checked?' reduced':''}`;b.type='button';b.dataset.id=n.id;b.setAttribute('aria-label',state.value==='mystery'?'未发现的科技':`${n.name}，${n.animation}`);const icon=document.createElement('div');icon.className='icon';const img=document.createElement('img');img.src=n.base;img.alt='';img.loading='lazy';icon.append(img);icon.insertAdjacentHTML('beforeend',overlays[n.id]);b.append(icon);const title=document.createElement('h2');title.textContent=state.value==='mystery'?'未发现的线索':n.name;b.append(title);const meta=document.createElement('div');meta.className='meta';meta.textContent=state.value==='mystery'?'?':`${n.id} · ${n.family}`;b.append(meta);b.title=state.value==='mystery'?'发现后查看':`${n.animation}\n${n.sourceType}\nentry: ${n.entry}`;const start=()=>{document.querySelectorAll('.run').forEach(x=>x.classList.remove('run'));if(state.value!=='mystery'&&!document.hidden)b.classList.add('run')};const stop=()=>b.classList.remove('run');b.addEventListener('pointerenter',start);b.addEventListener('focus',start);b.addEventListener('pointerleave',stop);b.addEventListener('blur',stop);grid.append(b)}document.querySelector('#stats').textContent=`${nodes.length} / ${manifest.nodeCount} 节点 · ${manifest.entryCount} entry · ${new Set(manifest.nodes.map(n=>n.family)).size} 语义类别 · 原始 PNG ${manifest.nodes.filter(n=>n.sourceType==='project-original-png').length} · 新绘 SVG ${manifest.nodes.filter(n=>n.sourceType==='authored-semantic-svg').length}`}
document.querySelector('#size').addEventListener('change',e=>{document.documentElement.style.setProperty('--icon-size',e.target.value+'px')});search.addEventListener('input',render);family.addEventListener('change',render);state.addEventListener('change',render);reduce.addEventListener('change',render);document.addEventListener('visibilitychange',()=>document.querySelectorAll('.run').forEach(b=>b.classList.remove('run')));render();
