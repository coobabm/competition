<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>摆渡众包 · 弹幕射击</title>
<!--
  弹幕射击 (雷霆战机 feel, 2016 live stream): danmaku lines fly right -> left toward the streamer sitting at the bottom-left.
  Hostile lines (骂主播 / 引战) must be shot, friendly ones (666, 前方高能 ...) must be let through.
  Your ship (mouse or WASD/arrows, hold space or mouse to fire) guards the left side; bullets fly right.
  灵光 is the purple wingman: it "reads" every line a moment after it appears and flags it hostile or not - right with
  probability 0.45 + 0.52*(skill-0.25)/0.72 (45% at skill 25%, ~97% at 95%), and only 65% of that on the tricky
  lines (sarcasm that sounds nice, slang that sounds rude).
  It auto-fires only at lines it flagged as hostile, so a weak 灵光 shoots friendly lines (灵光误伤了一条好评).
  Label produced: line -> hostile / friendly (shot hostile, passed friendly = 1 sample each).
  60 s waves; HP is the streamer's morale: a hostile line that reaches the streamer costs 1.
-->
<link rel="stylesheet" href="common.css">
<style>
#dm{position:absolute;inset:0;background:#0b1024;overflow:hidden}
#dmC{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
.dm-hud{position:absolute;left:130px;right:12px;top:8px;display:flex;align-items:center;gap:16px;color:#fff;font-size:13px;pointer-events:none;text-shadow:0 1px 2px #000}
.dm-hud .live{background:#E33E33;border-radius:3px;padding:0 6px;font-weight:800;font-size:12px;line-height:18px}
.dm-hud .hp{letter-spacing:2px;color:#FF6B8B;font-size:16px}
.dm-hud .hp i{font-style:normal;color:#ffffff44}
.dm-hud .tm{margin-left:auto;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.dm-hud .cb{color:#FFD84A;font-weight:800;font-size:16px;min-width:70px}
.dm-tip{position:absolute;left:130px;bottom:8px;color:#8E9AD0;font-size:12px;pointer-events:none}
.over{z-index:50;background:#0b1024ee;color:#fff}.over p{color:#C9D2F0}
.over .big{font-size:52px}
.over h2{color:#FFD84A}
.over table{border-collapse:collapse;font-size:14px}.over td{padding:3px 16px;text-align:left}.over td:last-child{text-align:right;font-weight:700;color:#FFE9A0}
.over .ex{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:620px}
.over .ex span{background:#ffffff14;border:1px solid #ffffff30;border-radius:6px;padding:3px 10px;font-size:13px}
.over .ex span.h{border-color:#ff6b6b;color:#ffb3b3}.over .ex span.f{border-color:#6BCB77;color:#b6ffc9}
</style>
</head>
<body>
<script src="common.js"></script>
<script>
const {stage}=LG.mount({
  id:'danmushooter', title:'弹幕射击', subtitle:'打掉骂主播的弹幕，好话放过', icon:'✈️', dataset:'弹幕情绪',
  stats:[['击落骂人','sKill'],['放行好评','sPass'],['误伤好评','sFriend'],['主播挨骂','sHurt'],['灵光击落','sAiKill'],['灵光误伤','sAiBad'],['本局收入','sPay','¥0']],
  statsNote:'击落骂人 / 放行好评 = 1 条样本',
  aiHello:'我是你的僚机。我会自己开火——打我觉得是骂人的。',
  rule:'<b>玩法</b>：弹幕飞向左下角的主播。<b>骂人、引战</b>的击落，<b>666、前方高能</b>放行。<br><b>操作</b>：鼠标或 WASD 移动，按住空格/左键开火。<br><b>灵光</b>是紫色僚机，自己读弹幕、自己开火；水平低就会误伤好评，它觉得该打的会套紫框。<br><b>代价</b>：你误伤 −¥1，灵光 −¥0.5，骂人的飞到主播 −1 心态。'
});
const $=s=>document.querySelector(s);
const {pick,rnd,shuffle}=LG;

let AC=null, lastSfx=0;
function beep(f,d=.08,type='sine',v=.05,f2){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=type;o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

// ---------- danmaku bank (2016 live-stream style) ----------
const HOSTILE=[
 '主播菜得抠脚','这操作是人类吗？下播吧','垃圾主播滚出直播界','主播水平也就这样，吹什么吹','收了多少钱，演技好差',
 '你是不是脑残啊','主播长得真丑，别开摄像头了','炸鱼主播，不要脸','取关了，浪费我时间','FFF团出来，烧死这对狗男女',
 'LOL比DOTA差远了，玩LOL的都是脑残','手游就是垃圾，玩端游的举个爪','苹果党都是智障，安卓才是王道','男的都是渣男，女的都是拜金女','刷了三个火箭你都没看见，狗主播',
 '这主播假唱吧，口型都对不上','笑死，就这还当主播','全是托，没一个真人','你妈妈知道你在这丢人吗','你们都被主播骗了，他是骗子',
 '举报了，等着封号吧','刷什么666，主播要饭呢','又来骗礼物了，恶心','傻X主播，滚','饭圈小学生闭嘴，别刷屏了',
 '死鱼眼主播，看着就烦','主播你是不是吃屎了，怎么这么菜','肯定是P的，主播根本不会玩','这种水平也配叫大神？','主播全家都不行',
];
const FRIEND=[
 '666666','主播好可爱！！','前方高能预警','哈哈哈哈哈哈哈','主播加油！','这波操作我给满分','我是路人，来学习了','已关注，每天都来看','主播今天穿得好好看',
 '送上一个火箭，主播辛苦了','前排前排！沙发是我的','233333','主播的声音太好听了','弹幕护体，大家文明发言','这个游戏我也在玩，一起组队吧','主播牛逼！',
 '这个BGM好听，求歌名','今天也是元气满满的一天','高能！高能！高能！','学到了学到了，记笔记','主播别熬夜，注意身体','我是来看颜值的，不后悔','打call！打call！',
 '主播的猫好可爱','泪目了，主播好样的','太强了，膜拜大神','主播晚安，明天见~','手机党表示很流畅','大佬带我飞','你们好，我是第一次来',
];
// Tricky lines: [text, hostile?]. Sarcasm that sounds nice, slang that sounds rude.
const TRICKY=[
 ['主播真厉害啊，菜得这么有个性',true],['呵呵，主播说得对，你们都对',true],['哇，主播好强哦（笑）下次不用玩了',true],['主播真是良心主播，收了钱的那种',true],['666，又被队友带飞的一天',true],
 ['你这波操作太骚了，笑死我了',false],['卧槽牛逼！！这也行',false],['我去，这也太秀了吧',false],['垃圾队友太坑了，主播别生气',false],['主播你个小坏蛋，又偷偷变强了',false],
 ['气死我了，怎么又是二楼的错，哈哈',false],['笑死我了，主播你是魔鬼吗',false],
];
const COLORS=['#FFFFFF','#FFFFFF','#FFFFFF','#FFFFFF','#FFE066','#7FE6FF','#FFB3D9','#B8FFB0'];

// ---------- state ----------
const W=stage.clientWidth, H=stage.clientHeight, LIM=120;
stage.innerHTML=`<div id="dm"><canvas id="dmC" width="${W}" height="${H}"></canvas>
  <div class="dm-hud"><span class="live">● LIVE</span><span>在线 12.3万</span><span class="hp" id="dmHp"></span><span id="dmWave">第 1 波</span><span class="cb" id="dmCb"></span><span class="tm" id="dmT">60</span></div>
  <div class="dm-tip">鼠标/WASD 移动 · 按住空格或左键开火 · 紫框是灵光觉得该打的</div></div>
<div class="over" id="dmOver"><div class="big">✈️</div><h2>弹幕射击</h2>
  <p>你在一场 2016 年的直播间里，要保护左下角的主播。<br>弹幕从右往左飞：<b>骂主播、引战</b>的打下来，<b>666、前方高能</b>这种好话放过去。<br>紫色僚机是灵光，它会自己开火，打它认为是骂人的——水平低的时候，常常打错。<br>每波 60 秒，主播心态 5 点，骂人的飞到主播身上扣 1 点。</p>
  <div class="ex"><span class="h">骂人：垃圾主播滚出直播界</span><span class="f">好话：前方高能预警</span></div>
  <button class="btn" id="dmGo" style="font-size:18px;padding:10px 40px">开播（回车）</button></div>`;
const cv=$('#dmC'), cx=cv.getContext('2d');
cx.font='bold 20px "PingFang SC","Microsoft YaHei",sans-serif';
const FONT='bold 20px "PingFang SC","Microsoft YaHei",sans-serif';

let run=false, raf=0, last=0, t=0, wave=1, hp=5, combo=0, spawnT=0, mood='idle', moodT=0, hurtFlash=0, sayT=0;
let ship, wing, bullets, lines, parts, floats, S, keys={}, hold=false, tx=300, ty=H/2, laneAt=[];
const LANES=11;

function newGame(){
  S={kill:0,pass:0,friend:0,hurt:0,aiKill:0,aiBad:0,earn:0,wavesDone:0,seen:[]};
  wave=1; hp=5; startWave(true);
}
function startWave(first){
  $('#dmOver').style.display='none';
  t=0; spawnT=.4; combo=0; bullets=[]; lines=[]; parts=[]; floats=[]; laneAt=new Array(LANES).fill(-9);
  ship={x:260,y:H/2,cd:0}; wing={x:212,y:H/2-60,cd:0,target:null};
  tx=ship.x; ty=ship.y; mood='idle'; run=true; S.waveHurt=0;
  if(first){ ['sKill','sPass','sFriend','sHurt','sAiKill','sAiBad'].forEach(k=>LG.set(k,0)); LG.set('sPay','¥0'); const h=document.getElementById('lgHist'); if(h) h.innerHTML=''; }
  const s=LG.skill();
  LG.say(s<.4?'僚机就位。我会开火，但我分不太清好话和坏话……':s<.7?'僚机就位。我大部分能分清，复杂的就难说了。':'僚机就位。阴阳怪气的我也能看出来一些了。');
  updHud(); last=performance.now(); cancelAnimationFrame(raf); raf=requestAnimationFrame(frame);
}

function updHud(){
  $('#dmHp').innerHTML='主播心态 '+'♥'.repeat(hp)+'<i>'+'♥'.repeat(Math.max(0,5-hp))+'</i>';
  $('#dmWave').textContent='第 '+wave+' 波';
  $('#dmCb').textContent=combo>1?'连击 ×'+combo:'';
  $('#dmT').textContent=Math.max(0,Math.ceil(60-t));
}
function say(txt,force){ if(!force&&performance.now()-sayT<2200) return; sayT=performance.now(); LG.say(txt); }

// ---------- spawning ----------
function spawnLine(){
  const trickyP=Math.min(.5,.06+.05*wave+t/60*.12);
  let text,hostile,tricky=false;
  if(Math.random()<trickyP){ const x=pick(TRICKY); text=x[0]; hostile=x[1]; tricky=true; }
  else if(Math.random()<.46){ text=pick(HOSTILE); hostile=true; }
  else { text=pick(FRIEND); hostile=false; }
  // free lane
  let lane=-1; const free=[]; for(let i=0;i<LANES;i++) if(t-laneAt[i]>1.6) free.push(i);
  if(!free.length) return;
  lane=pick(free); laneAt[lane]=t;
  cx.font=FONT; const w=Math.ceil(cx.measureText(text).width)+22, h=30;
  const y=48+lane*((H-100)/(LANES-1))-h/2+0;
  const sp=(95+rnd(40))*(1+.09*(wave-1))*(1+t/60*.25);
  const s=LG.skill(), acc=Math.max(.3,Math.min(.97,.45+.52*(s-.25)/.72)), p=tricky?acc*.65:acc;
  const aiHostile=Math.random()<p?hostile:!hostile;
  lines.push({text,hostile,tricky,x:W+4,y:y<44?44:y,w,h,v:sp,col:pick(COLORS),aiHostile,read:false,readT:0,flag:false,dead:false});
}

// ---------- events ----------
function burst(l,col){
  for(let i=0;i<14;i++) parts.push({x:l.x+Math.random()*l.w,y:l.y+Math.random()*l.h,vx:(Math.random()-.5)*260,vy:(Math.random()-.8)*200,life:.7,col,ch:Array.from(l.text)[rnd(Array.from(l.text).length)]});
}
function addFloat(x,y,txt,col){ floats.push({x,y,txt,col,life:1.1}); }
function hit(l,by){
  l.dead=true;
  if(l.hostile){
    if(by==='me'){
      combo++; const pay=1+Math.min(combo-1,5)*.2; LG.give(1,pay); S.earn+=pay; S.kill++; LG.set('sKill',S.kill);
      addFloat(l.x,l.y,'+¥'+pay.toFixed(1)+(combo>2?' ×'+combo:''),'#FFD84A'); LG.hist('ok'); beep(500+Math.min(combo,8)*40,.08,'square',.04,900);
      if(!l.aiHostile) say('这条是骂人的？我刚才没看出来。');
    }else{
      LG.give(1,.5); S.earn+=.5; S.aiKill++; LG.set('sAiKill',S.aiKill); addFloat(l.x,l.y,'灵光 +¥0.5','#C9BEFF'); LG.hist('ai'); beep(620,.07,'triangle',.04,980);
      say(pick(['这条我就觉得是骂人的。','这句不对劲，我打掉了。']));
    }
    burst(l,'#FF8A80');
  }else{
    if(by==='me'){
      combo=0; LG.give(0,-1); S.earn-=1; S.friend++; LG.set('sFriend',S.friend); addFloat(l.x,l.y,'误伤好评 −¥1','#bbb'); LG.hist('no');
      if(l.aiHostile) say('我也觉得它不好……原来是好话，我记住了。',true);
    }else{
      LG.give(0,-.5); S.earn-=.5; S.aiBad++; LG.set('sAiBad',S.aiBad); addFloat(l.x,l.y,'灵光误伤 −¥0.5','#C9BEFF'); LG.hist('no','误');
      say('灵光误伤了一条好评：「'+l.text+'」。……原来是夸人的。',true); LG.shake($('#dmC'));
    }
    beep(150,.2,'sawtooth',.05,80); burst(l,'#9AA3C7');
  }
  LG.set('sPay','¥'+S.earn.toFixed(1)); updHud();
}
function reach(l){
  l.dead=true;
  if(l.hostile){
    hp--; S.hurt++; S.waveHurt++; combo=0; LG.give(0,-.5); S.earn-=.5; LG.set('sHurt',S.hurt); LG.set('sPay','¥'+S.earn.toFixed(1));
    mood='sad'; moodT=1.3; hurtFlash=.5; addFloat(LIM+6,l.y,'主播被骂了！','#FF6B6B'); LG.hist('no','骂'); beep(110,.35,'sawtooth',.06,50);
    say(l.aiHostile?'我标出来了，但没打到……':'这条骂人的我没看出来……',true);
    if(hp<=0) gameOver();
  }else{
    S.pass++; LG.set('sPass',S.pass); LG.give(1,.3); S.earn+=.3; LG.set('sPay','¥'+S.earn.toFixed(1));
    mood='happy'; moodT=.7; addFloat(LIM+6,l.y,'+¥0.3','#9BE7A8'); LG.hist('ok','好'); beep(760,.05,'triangle',.025);
    if(l.aiHostile&&Math.random()<.5) say('这条我以为是骂人的……还好没开火，原来是好话。');
  }
  updHud();
}

// ---------- update / draw ----------
function update(dt){
  t+=dt; if(moodT>0){ moodT-=dt; if(moodT<=0) mood='idle'; } if(hurtFlash>0) hurtFlash-=dt;
  const s=LG.skill();
  // spawning stops at 60 s
  if(t<60){ spawnT-=dt; if(spawnT<=0){ spawnLine(); spawnT=Math.max(.42,1.25-.011*t-.05*(wave-1))*(.75+Math.random()*.5); } }
  // ship
  const sp=420;
  let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0), dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);
  if(dx||dy){ tx+=dx*sp*dt; ty+=dy*sp*dt; }
  tx=Math.max(170,Math.min(520,tx)); ty=Math.max(60,Math.min(H-26,ty));
  const mx=tx-ship.x, my=ty-ship.y, d=Math.hypot(mx,my), step=Math.min(d,950*dt);
  if(d>0){ ship.x+=mx/d*step; ship.y+=my/d*step; }
  ship.cd-=dt;
  if((hold||keys[' '])&&ship.cd<=0){ ship.cd=.14; bullets.push({x:ship.x+24,px:ship.x+24,y:ship.y,vx:900,by:'me'}); if(performance.now()-lastSfx>90){ lastSfx=performance.now(); beep(900,.03,'square',.012,500); } }
  // wingman: read lines, choose a flagged one, align, fire
  wing.x=ship.x-52;
  for(const l of lines){
    if(l.dead||l.read) continue;
    if(l.x<W-40){ if(!l.readT) l.readT=t+.25+(1-s)*.9; if(t>=l.readT){ l.read=true; l.flag=l.aiHostile; if(l.flag) beep(700,.05,'triangle',.02); } }
  }
  let target=null;
  for(const l of lines){ if(l.dead||!l.flag) continue; if(l.x+l.w<wing.x+20) continue; if(!target||l.x<target.x) target=l; }
  wing.target=target;
  const wy=target?target.y+target.h/2:ship.y-70, wsp=140+280*s;
  const ddy=wy-wing.y; wing.y+=Math.sign(ddy)*Math.min(Math.abs(ddy),wsp*dt);
  wing.y=Math.max(60,Math.min(H-26,wing.y));
  wing.cd-=dt;
  if(target&&Math.abs(wing.y-(target.y+target.h/2))<target.h/2-2&&wing.cd<=0){ wing.cd=1/(2.4+3.4*s); bullets.push({x:wing.x+16,px:wing.x+16,y:wing.y,vx:880,by:'ai'}); }
  // lines
  for(const l of lines){ if(l.dead) continue; l.x-=l.v*dt; if(l.x<LIM) reach(l); }
  // bullets
  for(const b of bullets){
    b.px=b.x; b.x+=b.vx*dt;
    for(const l of lines){ if(l.dead) continue;
      if(b.y>=l.y-3&&b.y<=l.y+l.h+3&&b.px<=l.x+l.w&&b.x>=l.x){ b.dead=true; hit(l,b.by); break; } }
    if(b.x>W+10) b.dead=true;
  }
  bullets=bullets.filter(b=>!b.dead); lines=lines.filter(l=>!l.dead);
  for(const p of parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=500*dt; p.life-=dt; } parts=parts.filter(p=>p.life>0);
  for(const f of floats){ f.y-=36*dt; f.life-=dt; } floats=floats.filter(f=>f.life>0);
  if(Math.ceil(60-t)!==+$('#dmT').textContent) updHud();
  if(t>=60&&!lines.length&&run) waveClear();
}

function drawBg(){
  const g=cx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#141B3D'); g.addColorStop(1,'#0A0E22'); cx.fillStyle=g; cx.fillRect(0,0,W,H);
  // faint "game screen" behind the danmaku
  cx.strokeStyle='#ffffff0d'; cx.lineWidth=1;
  for(let x=LIM+((-t*18)%60);x<W;x+=60){ cx.beginPath(); cx.moveTo(x,36); cx.lineTo(x,H); cx.stroke(); }
  for(let y=60;y<H;y+=60){ cx.beginPath(); cx.moveTo(LIM,y); cx.lineTo(W,y); cx.stroke(); }
  cx.fillStyle='#ffffff08'; cx.fillRect(LIM+40,90,W-LIM-80,H-180);
  cx.fillStyle='#ffffff14'; cx.font='bold 54px sans-serif'; cx.textAlign='center'; cx.fillText('排位赛 · 第 '+(wave)+' 局',(W+LIM)/2,H/2+10); cx.textAlign='left';
  // top bar
  cx.fillStyle='#00000066'; cx.fillRect(0,0,W,34);
}
function drawStreamer(){
  cx.fillStyle='#18204A'; cx.fillRect(0,0,LIM,H);
  const hf=hurtFlash>0?Math.min(1,hurtFlash*2):0;
  cx.fillStyle=hf?`rgba(255,60,60,${.25*hf})`:'#00000000'; cx.fillRect(0,0,LIM,H);
  cx.strokeStyle=hf?'#FF5A4F':'#4E6EF2'; cx.lineWidth=hf?4:2; cx.setLineDash([8,6]); cx.beginPath(); cx.moveTo(LIM,34); cx.lineTo(LIM,H); cx.stroke(); cx.setLineDash([]);
  // desk, monitor, silhouette
  cx.fillStyle='#1A2347'; cx.fillRect(6,H-62,LIM-14,10);
  cx.fillStyle='#233066'; cx.fillRect(14,H-132,68,46);
  const gl=cx.createLinearGradient(14,H-132,82,H-86); gl.addColorStop(0,'#4E6EF2aa'); gl.addColorStop(1,'#8A78E855'); cx.fillStyle=gl; cx.fillRect(18,H-128,60,38);
  cx.fillStyle='#04060E'; cx.beginPath(); cx.arc(76,H-142,19,0,7); cx.fill();                       // head
  cx.beginPath(); cx.ellipse(76,H-84,32,28,0,Math.PI,0); cx.fill();                               // shoulders
  cx.strokeStyle='#2a3a8a'; cx.lineWidth=3; cx.beginPath(); cx.arc(76,H-144,22,Math.PI*1.05,Math.PI*1.95); cx.stroke(); // headset
  cx.beginPath(); cx.moveTo(56,H-140); cx.lineTo(54,H-128); cx.lineTo(62,H-128); cx.stroke();
  cx.font='22px sans-serif'; cx.textAlign='center'; cx.fillText(mood==='sad'?'😢':mood==='happy'?'😊':'🎮',76,H-170);
  cx.font='bold 12px sans-serif'; cx.fillStyle='#9FB0FF'; cx.fillText('主播',60,H-36); cx.fillText('(读弹幕区)',60,H-20); cx.textAlign='left';
}
function drawShip(x,y,col,ai){
  cx.save(); cx.translate(x,y); cx.shadowColor=col; cx.shadowBlur=14;
  cx.fillStyle=col; cx.beginPath(); cx.moveTo(24,0); cx.lineTo(-14,-14); cx.lineTo(-6,0); cx.lineTo(-14,14); cx.closePath(); cx.fill();
  cx.shadowBlur=0; cx.fillStyle=ai?'#2d2470':'#0c3a5a'; cx.beginPath(); cx.moveTo(8,0); cx.lineTo(-6,-5); cx.lineTo(-6,5); cx.closePath(); cx.fill();
  cx.fillStyle='#FFB347aa'; cx.beginPath(); cx.moveTo(-8,-4); cx.lineTo(-22-Math.random()*8,0); cx.lineTo(-8,4); cx.fill();
  cx.restore();
}
function draw(){
  cx.clearRect(0,0,W,H); drawBg();
  // lines
  cx.font=FONT; cx.textBaseline='middle';
  for(const l of lines){
    cx.fillStyle='#00000055'; cx.beginPath(); cx.roundRect?cx.roundRect(l.x,l.y,l.w,l.h,15):cx.rect(l.x,l.y,l.w,l.h); cx.fill();
    if(l.flag){ cx.strokeStyle='#A58CFF'; cx.lineWidth=2.5; cx.shadowColor='#8A78E8'; cx.shadowBlur=10; cx.stroke(); cx.shadowBlur=0; }
    cx.lineWidth=3; cx.strokeStyle='#000'; cx.strokeText(l.text,l.x+11,l.y+l.h/2+1); cx.fillStyle=l.col; cx.fillText(l.text,l.x+11,l.y+l.h/2+1);
    if(l.flag){ cx.fillStyle='#8A78E8'; cx.beginPath(); cx.arc(l.x+1,l.y+1,9,0,7); cx.fill(); cx.fillStyle='#fff'; cx.font='bold 11px sans-serif'; cx.textAlign='center'; cx.fillText('灵',l.x+1,l.y+2); cx.textAlign='left'; cx.font=FONT; }
  }
  cx.textBaseline='alphabetic';
  // wingman targeting beam
  if(wing.target&&!wing.target.dead){ cx.strokeStyle='#8A78E855'; cx.lineWidth=1; cx.setLineDash([4,5]); cx.beginPath(); cx.moveTo(wing.x+20,wing.y); cx.lineTo(wing.target.x,wing.target.y+wing.target.h/2); cx.stroke(); cx.setLineDash([]); }
  // links and ships
  cx.strokeStyle='#ffffff22'; cx.beginPath(); cx.moveTo(ship.x-8,ship.y); cx.lineTo(wing.x,wing.y); cx.stroke();
  drawShip(ship.x,ship.y,'#4DD2FF',false);
  cx.save(); cx.translate(wing.x,wing.y); cx.scale(.75,.75); cx.translate(-wing.x,-wing.y); drawShip(wing.x,wing.y,'#9B86FF',true); cx.restore();
  cx.fillStyle='#fff'; cx.font='bold 11px sans-serif'; cx.textAlign='center'; cx.fillText('灵光',wing.x,wing.y-18); cx.textAlign='left';
  for(const b of bullets){ cx.fillStyle=b.by==='me'?'#8CF3FF':'#C9BEFF'; cx.shadowColor=cx.fillStyle; cx.shadowBlur=8; cx.fillRect(b.x-8,b.y-2,16,4); cx.shadowBlur=0; }
  for(const p of parts){ cx.globalAlpha=Math.max(0,p.life/.7); cx.fillStyle=p.col; cx.font='bold 16px sans-serif'; cx.fillText(p.ch,p.x,p.y); } cx.globalAlpha=1;
  cx.font='bold 17px sans-serif';
  for(const f of floats){ cx.globalAlpha=Math.min(1,f.life*1.5); cx.fillStyle='#000'; cx.fillText(f.txt,f.x+1,f.y+1); cx.fillStyle=f.col; cx.fillText(f.txt,f.x,f.y); } cx.globalAlpha=1;
  drawStreamer();
}
function frame(ts){
  if(!run){ draw(); return; }
  const dt=Math.min(.05,(ts-last)/1000); last=ts;
  update(dt); draw();
  if(run) raf=requestAnimationFrame(frame);
}

// ---------- wave / game over ----------
function summary(){
  const s=LG.skill();
  return `<tr><td>击落骂人 / 放行好评</td><td>${S.kill} / ${S.pass}</td></tr>
    <tr><td>误伤好评</td><td>${S.friend}（灵光 ${S.aiBad}）</td></tr>
    <tr><td>主播挨骂</td><td>${S.hurt} 次</td></tr>
    <tr><td><span class="tagai">灵光</span> 击落骂人</td><td>${S.aiKill} 条</td></tr>
    <tr><td>累计收入</td><td>¥${S.earn.toFixed(1)}</td></tr>`;
}
function waveClear(){
  run=false; S.wavesDone++;
  const perfect=S.waveHurt===0, bonus=perfect?2+wave:0;
  if(bonus){ LG.give(0,bonus); S.earn+=bonus; LG.set('sPay','¥'+S.earn.toFixed(1)); }
  hp=Math.min(5,hp+1); updHud();
  const ov=$('#dmOver'); ov.style.display='flex';
  ov.innerHTML=`<div class="big">${perfect?'🏆':'📺'}</div><h2>第 ${wave} 波结束${perfect?' · 主播毫发无伤':''}</h2>
    <table>${summary()}<tr><td>${perfect?'无伤奖励':'主播心态'}</td><td>${perfect?'+¥'+bonus.toFixed(1):'+1（现 '+hp+'）'}</td></tr></table>
    <p>${S.aiBad>S.aiKill?'灵光：我打错的比打对的多……我再学学。':S.aiBad?'灵光：我误伤了 '+S.aiBad+' 条，下波我会小心点。':'灵光：这一波我没打错一条。'}</p>
    <button class="btn" id="dmNext" style="font-size:16px;padding:9px 34px">下一波（回车）</button>`;
  $('#dmNext').onclick=()=>{ wave++; startWave(false); };
  beep(660,.15,'triangle',.06,990);
}
function gameOver(){
  run=false;
  const ov=$('#dmOver'); ov.style.display='flex';
  ov.innerHTML=`<div class="big">📴</div><h2>主播下播了 · 坚持到第 ${wave} 波</h2>
    <table>${summary()}</table>
    <p>${S.aiBad>=3?'灵光：好评被我打掉了 '+S.aiBad+' 条……对不起，我会记住这些话是夸人的。':S.aiKill?'灵光：我一共帮你打掉 '+S.aiKill+' 条骂人的弹幕。':'灵光：这回我没帮上什么忙。'}（现在水平 ${Math.round(LG.skill()*100)}%）</p>
    <button class="btn" id="dmAgain" style="font-size:16px;padding:9px 34px">再来一局（回车）</button>`;
  $('#dmAgain').onclick=newGame;
  LG.say(S.aiBad?'误伤了 '+S.aiBad+' 条好评，但每次你放行/击落，我都在学。':'下播了。弹幕我看了不少。');
}

// ---------- input ----------
cv.addEventListener('pointermove',e=>{ const p=LG.local(e,cv); tx=p.x; ty=p.y; });
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); hold=true; const p=LG.local(e,cv); tx=p.x; ty=p.y; try{cv.setPointerCapture(e.pointerId);}catch(_){} });
addEventListener('pointerup',()=>hold=false);
addEventListener('blur',()=>{ hold=false; keys={}; });
addEventListener('keydown',e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k)) e.preventDefault();
  if(k==='Enter'){
    if(e.repeat) return;
    const b=$('#dmNext')||$('#dmAgain')||$('#dmGo'); if(!run&&$('#dmOver').style.display!=='none'&&b){ b.click(); return; }
  }
  keys[k]=true;
});
addEventListener('keyup',e=>{ const k=e.key.length===1?e.key.toLowerCase():e.key; keys[k]=false; });
$('#dmGo').onclick=newGame;
// draw an idle frame behind the start screen
S={kill:0,pass:0,friend:0,hurt:0,aiKill:0,aiBad:0,earn:0,wavesDone:0}; ship={x:260,y:H/2}; wing={x:208,y:H/2-60}; bullets=[]; lines=[]; parts=[]; floats=[]; draw();
</script>
</body>
