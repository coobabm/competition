<!--
  飞花令 (《中国诗词大会》, CCTV-1, Feb 2016). A theme character; you and 灵光 take turns saying a classical line that
  contains it. Lines are not repeated. Whoever fails first loses the round; 5 rounds.
  Your turn: pick the one real, unused line from 4 candidates (10 s). The other three are garbled / spliced lines that look
  plausible, a real line without the character, or a line already said. Each pick labels four candidates real / fake.
  灵光's turn: with probability q(skill) it says a real unused line from the bank; otherwise it produces a garbled or invented
  line and the judge rejects it ("查无此句"). So a weak 灵光 loses rounds quickly, a strong one forces you to really know poems.
-->

/* ---------- sound ---------- */
let AC;
function beep(f,d,type,v,when){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(when||0);
  o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(v||.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+(d||.08)); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+(d||.08)+.02);}catch(e){} }
const sfx={ok(){beep(660,.1,'triangle',.07);beep(990,.16,'triangle',.07,.09);},bad(){beep(180,.3,'sawtooth',.05);},tick(){beep(1200,.03,'square',.02);},gong(){beep(220,.6,'sine',.09);beep(330,.5,'sine',.05,.02);},ai(){beep(420,.1,'sine',.05);}};

/* ---------- the bank: real lines (Tang / Song, public domain), tagged by the characters they contain ---------- */

const LINES=RAW.trim().split('\n').map(l=>{ const p=l.split('|'); return {t:p[0],s:p[1]}; });
const REAL=new Set(LINES.map(l=>l.t));
const BY=new Map(LINES.map(l=>[l.t,l]));
const THEMES=['花','月','春','风','山','水','雨','夜'];
const byChar=ch=>LINES.filter(l=>l.t.indexOf(ch)>=0);
const POOL=[...'风云雪霜烟江海天星雨山水花月春秋夜日人心情梦思君愁泪酒柳草木鸟马舟城楼门窗灯影声寒暖红白青黄碧金玉'];

/* ---------- fake line makers ---------- */
function garble(line,th,n){ const a=[...line], idx=LG.shuffle([...a.keys()].filter(i=>a[i]!==th));
  for(let k=0;k<n&&k<idx.length;k++){ let c,g=0; do{ c=LG.pick(POOL); }while((c===a[idx[k]]||c===th)&&++g<20); a[idx[k]]=c; } return a.join(''); }
function splice(th){ // first half of one line + second half of another, same length, still contains the theme char
  for(let k=0;k<30;k++){ const A=LG.pick(byChar(th)), cands=LINES.filter(l=>l.t.length===A.t.length&&l.t!==A.t); if(!cands.length) continue; const B=LG.pick(cands);
    const cut=A.t.length===5?2:3; const r=A.t.slice(0,cut)+B.t.slice(cut); if(r.indexOf(th)>=0&&!REAL.has(r)) return r; }
  return garble(LG.pick(byChar(th)).t,th,2); }
function fakeLine(th,kind){ let r,g=0; do{ r=kind==='splice'?splice(th):garble(LG.pick(byChar(th)).t,th,1+LG.rnd(2)); }while(REAL.has(r)&&++g<20); return r; }
function gibberish(th){ const len=LG.pick([5,7]); const a=Array.from({length:len},()=>LG.pick(POOL)); a[LG.rnd(len)]=th; return a.join(''); }

/* ---------- state ---------- */
const ROUNDS=5, TLIM=10, CAP=4; // CAP: lines each per round; if nobody fails the round is a draw
const F={on:false,r:-1,order:[],theme:'',used:new Set(),turn:'',phase:'',win:0,lose:0,draw:0,n:0,lines:0,pay:0,combo:0,best:0,aiReal:0,aiAll:0,t0:0,raf:0,opts:[],aiTO:0,nextTO:0,fastest:99,total:0};
const $=id=>document.getElementById(id);
stage.innerHTML=`
<div class="fh">
  <div class="ban"><b>飞 花 令</b><em>中国诗词大会 · 第一季</em><div class="sc"><span>第 <b id="rN" style="color:#fff">1</b>/${ROUNDS} 局</span><span>你 <strong id="scMe">0</strong> : <strong id="scAi" style="color:#CBBEFF">0</strong> 灵光</span></div></div>

/* ---------- helpers ---------- */
function judgeSay(t){ $('jt').innerHTML=t; }
function stamp(ok){ const s=$('stamp'); s.textContent=ok?'通 过':'驳 回'; s.className='stamp '+(ok?'ok':'no'); void s.offsetWidth; s.classList.add('show'); }
function addChain(who,text,ok,src){
  const c=$('chain'), e=document.createElement('div'); e.className='ent '+who+(ok?'':' bad');
  e.innerHTML=text+(src?`<small>${src}</small>`:'')+`<span class="mk">${ok?'✓':'✗'}</span>`; c.appendChild(e); c.scrollTop=c.scrollHeight; $('cN').textContent=c.children.length+' 句';
}
function setTurn(who){ F.turn=who; const t=$('turn'); t.textContent=who==='me'?'你的回合':'灵光的回合'; t.className='turn'+(who==='ai'?' ai':''); $('opts').style.display=who==='me'?'grid':'none'; $('think').style.display=who==='ai'?'flex':'none'; $('tm').parentNode.style.visibility=who==='me'?'visible':'hidden'; }
function sync(){ LG.set('sOk',F.win); LG.set('sNo',F.lose); LG.set('sLines',F.lines); LG.set('sAi',F.aiAll?F.aiReal+'/'+F.aiAll+' 句':'—'); LG.set('sPay','¥'+F.pay.toFixed(1)); $('scMe').textContent=F.win; $('scAi').textContent=F.lose; }

/* ---------- a round ---------- */
function startGame(){
  Object.assign(F,{on:true,r:-1,order:LG.shuffle(THEMES).slice(0,ROUNDS),win:0,lose:0,draw:0,lines:0,pay:0,combo:0,best:0,aiReal:0,aiAll:0,fastest:99});
  const h=document.getElementById('lgHist'); if(h) h.innerHTML=''; $('over').style.display='none'; $('chain').innerHTML=''; sync();
  nextRound();
}
function nextRound(){
  clearTimeout(F.aiTO); clearTimeout(F.nextTO); cancelAnimationFrame(F.raf);
  F.r++; if(F.r>=ROUNDS) return finish();
  F.theme=F.order[F.r]; F.used=new Set(); F.phase=''; F.n=0;
  $('rN').textContent=F.r+1; $('seal').textContent=F.theme; $('thT').textContent=F.theme; $('seal').classList.remove('pop'); void $('seal').offsetWidth; $('seal').classList.add('pop');
  $('chain').innerHTML=''; $('cN').textContent='0 句'; $('stamp').className='stamp'; sfx.gong();
  judgeSay('评委：第 '+(F.r+1)+' 局，飞花令——<b style="color:#B3282D">「'+F.theme+'」</b>。你先来。');
  LG.say(LG.skill()>.7?'「'+F.theme+'」我库里有一大把。':LG.skill()>.4?'「'+F.theme+'」……我试试。':'「'+F.theme+'」？我只会一两句……');
  F.nextTO=setTimeout(()=>playerTurn(),900);
}
function playerTurn(){
  const th=F.theme, pool=byChar(th).filter(l=>!F.used.has(l.t));
  if(!pool.length){ return endRound(false,'「'+th+'」字的诗，你一句也想不出来了。'); }
  setTurn('me');
  const right=pool[LG.rnd(pool.length)], opts=[{t:right.t,s:right.s,ok:true,kind:'real'}], taken=new Set([right.t]);
  const add=(t,kind,s)=>{ if(taken.has(t)) return false; taken.add(t); opts.push({t,s,ok:false,kind}); return true; };
  let g=0; while(opts.length<2&&g++<20) add(fakeLine(th,'garble'),'fake');
  g=0; while(opts.length<3&&g++<20) add(fakeLine(th,'splice'),'fake');
  // fourth: a line that was already said, or a real line without the character
  const usedLines=[...F.used].filter(t=>BY.has(t));
  if(usedLines.length&&Math.random()<.6){ const t=LG.pick(usedLines); opts.push({t,s:BY.get(t).s,ok:false,kind:'used'}); taken.add(t); }
  else { const no=LG.shuffle(LINES.filter(l=>l.t.indexOf(th)<0&&!taken.has(l.t)&&l.t.length===right.t.length)); if(no.length){ opts.push({t:no[0].t,s:no[0].s,ok:false,kind:'nochar'}); } else add(fakeLine(th,'garble'),'fake'); }
  while(opts.length<4) add(fakeLine(th,'garble'),'fake');
  F.opts=LG.shuffle(opts); F.phase='me';
  const o=$('opts'); o.innerHTML='';
  F.opts.forEach((p,i)=>{ const d=document.createElement('div'); d.className='opt'; d.innerHTML=`<span class="k">${i+1}</span>${p.t}`; d.onclick=()=>pick(i); p.el=d; o.appendChild(d); });
  F.t0=performance.now(); cancelAnimationFrame(F.raf); loop();
}
function loop(){
  if(F.phase!=='me') return;
  const el=(performance.now()-F.t0)/1000, f=Math.max(0,1-el/TLIM), bar=$('tm');
  bar.style.transform=`scaleX(${f})`; bar.style.background=f>.5?'var(--green)':f>.25?'var(--gold)':'var(--red)';
  const s=Math.ceil(TLIM-el); $('tleft').textContent=s+' 秒'; if(s!==F.ls&&s<=3&&s>0) sfx.tick(); F.ls=s;
  if(el>=TLIM){ F.phase=''; F.opts.forEach(p=>{ if(p.ok) p.el.classList.add('good'); else p.el.classList.add('dim'); }); stamp(false); sfx.bad(); judgeSay('评委：时间到。这一局，<b>你</b>说不出来了。'); return setTimeout(()=>endRound(false,'超时'),1100); }
  F.raf=requestAnimationFrame(loop);
}
function pick(i){
  if(F.phase!=='me') return; F.phase='judge'; cancelAnimationFrame(F.raf);
  const p=F.opts[i], took=(performance.now()-F.t0)/1000;
  F.opts.forEach(q=>{ if(q.ok) q.el.classList.add('good'); else if(q!==p) q.el.classList.add('dim'); });
  if(p.ok){
    F.used.add(p.t); F.lines++; F.combo++; F.best=Math.max(F.best,F.combo); F.fastest=Math.min(F.fastest,took);
    const pay=+(1+Math.max(0,1-took/TLIM)*.5+Math.min(F.combo-1,4)*.2).toFixed(1); F.pay+=pay; LG.give(1,pay,p.el,'var(--red)'); LG.hist('ok');
    addChain('me',p.t,true,p.s); stamp(true); sfx.ok(); sync();
    judgeSay('评委：<b style="color:#2F9E44">正确</b>，'+p.s+'。');
    const sk=LG.skill(); LG.say(sk>.7?LG.pick(['好句。我这儿还有。','不错。轮到我了。']):sk>.4?LG.pick(['这句我也背过……','你背得真熟。']):LG.pick(['这句我没听过……','哇，你是诗词大会选手吗？']));
    F.n++; F.nextTO=setTimeout(()=>{ if(F.n>=CAP*2) endRound(null,'双方各说了 '+CAP+' 句，都没出错'); else aiTurn(); },1300);
  } else {
    p.el.classList.add('bad'); F.combo=0; F.pay-=.5; LG.give(0,-.5,p.el,'#999'); LG.hist('no'); sfx.bad(); stamp(false); LG.shake(p.el); sync();
    addChain('me',p.t,false);
    const th=F.theme;
    judgeSay('评委：'+(p.kind==='used'?'这句刚才已经说过了。':p.kind==='nochar'?'这句是真的（'+p.s+'），但没有「'+th+'」字。':'查无此句。这是被改过的诗。')+' <b>你</b>输了这一局。');
    LG.say(LG.skill()>.6?'这句不对。我听出来了。':'诶？这句是真的吗？我也分不清……');
    F.nextTO=setTimeout(()=>endRound(false,'选错'),1700);
  }
}
function aiTurn(){
  setTurn('ai'); F.phase='ai'; const th=F.theme, sk=LG.skill();
  const pool=byChar(th).filter(l=>!F.used.has(l.t));
  $('aiLine').innerHTML='&nbsp;';
  const delay=700+(1-sk)*2200+LG.rnd(500);
  F.aiTO=setTimeout(()=>{
    if(!F.on) return;
    if(!pool.length){ addChain('ai','……',false); stamp(false); sfx.bad(); judgeSay('评委：灵光，词穷了。<b>你</b>赢了这一局。'); LG.say('我……想不出来了。这个字的诗，我都说完了。'); return F.nextTO=setTimeout(()=>endRound(true,'灵光词穷'),1700); }
    const q=Math.min(.97,.18+.8*sk), real=Math.random()<q; F.aiAll++;
    let text,src='',ok=false;
    if(real){ const l=pool[LG.rnd(pool.length)]; text=l.t; src=l.s; ok=true; F.aiReal++; }
    else { const r=Math.random(); text=(sk<.4&&r<.35)?gibberish(th):fakeLine(th,r<.6?'garble':'splice'); }
    $('aiLine').textContent=text; sfx.ai();
    LG.say(ok?(sk>.7?LG.pick(['这一句，我选这个。','「'+th+'」字的诗，我还有很多。']):sk>.4?LG.pick(['这句我背过。','我来一句。']):LG.pick(['我想起来了！就是这句。','应该……是这句。'])):
      (sk>.6?LG.pick(['这句……好像记错了一个字。','我刚才是不是串行了？']):LG.pick(['这句……是我自己编的……吗？','床前……不对，我也不知道。','这听起来像诗，对吧？'])));
    setTimeout(()=>{
      if(!F.on) return;
      addChain('ai',text,ok,src); LG.hist(ok?'ai':'no'); sync();
      if(ok){ F.used.add(text); stamp(true); sfx.ok(); judgeSay('评委：<b style="color:#2F9E44">正确</b>，'+src+'。轮到你了。'); F.n++; F.nextTO=setTimeout(()=>{ if(F.n>=CAP*2) endRound(null,'双方各说了 '+CAP+' 句，都没出错'); else playerTurn(); },1200); }
      else { stamp(false); sfx.bad(); judgeSay('评委：<b>查无此句</b>。灵光这一局输了。'); LG.say(sk>.6?'……我串了。下次不会。':'我编的不对吗？看起来很像啊。'); F.nextTO=setTimeout(()=>endRound(true,'灵光编了一句假诗'),1800); }
    },700);
  },delay);
}
function endRound(youWin,why){
  if(!F.on) return; F.phase=''; clearTimeout(F.aiTO); cancelAnimationFrame(F.raf);
  if(youWin===null){ F.draw++; F.pay+=1; LG.give(0,1,$('seal'),'var(--red)'); sfx.gong(); }
  else if(youWin){ F.win++; F.pay+=2; LG.give(0,2,$('seal'),'var(--red)'); sfx.ok(); } else { F.lose++; F.combo=0; }
  sync();
  judgeSay('第 '+(F.r+1)+' 局：'+(youWin===null?'<b style="color:#8A7A5C">平局</b>（'+why+'）。+¥1':'<b style="color:'+(youWin?'#2F9E44':'#E33E33')+'">'+(youWin?'你赢了':'灵光赢了')+'</b>（'+why+'）。'+(youWin?'+¥2':'')));
  F.nextTO=setTimeout(nextRound,1900);
}
function finish(){
  F.on=false; const o=$('over'); o.style.display='flex';
  const w=F.win>F.lose, aiRate=F.aiAll?Math.round(F.aiReal/F.aiAll*100):0;
  o.innerHTML=`<h2>${w?'🌸 你赢了灵光':F.win===F.lose?'平局':'灵光获胜'}　${F.win} : ${F.lose}${F.draw?'（平 '+F.draw+'）':''}</h2>
   <p>${w?'「花落知多少」——这回是你背得多。':F.win===F.lose?'旗鼓相当。':'灵光背得比你多。多教教它，也多背几首。'}</p>
   <div class="res"><span>你说出的真诗</span><b>${F.lines} 句</b><span>最高连击</span><b>×${F.best}</b><span>收入</span><b style="color:var(--red)">¥${F.pay.toFixed(1)}</b><span>灵光说对的诗</span><b style="color:var(--ai)">${F.aiReal}/${F.aiAll}（${aiRate}%）</b></div>
   <button class="btn" id="again">再来一场 (Enter)</button>`;
  $('again').onclick=startGame; LG.say(w?'你背得真多……我回去再背。':'这次我背对了不少。');
}
function intro(){
  const o=$('over'); o.style.display='flex';
  o.innerHTML=`<h2>🌸 飞花令</h2>
   <p>《中国诗词大会》里的游戏：定一个字，轮流说出带这个字的诗句。<br>
   每局一个字（花、月、春、风、山、水、雨、夜……），你先说。<b>10 秒</b>内，从 4 句里选出真的那句——<br>
   另外三句是被改过的诗、拼起来的诗，或者<b>已经说过</b>的、<b>没有那个字</b>的真诗。<br>
   然后轮到<b style="color:var(--ai)">灵光</b>。它水平低时会背串、编句子，评委当场驳回；水平高时背得又快又对，你得拿真本事。<br>
   先说不出来的输这一局；双方各说满 ${CAP} 句都没出错就算平局。共 ${ROUNDS} 局。选对 +¥1 起，赢一局 +¥2，选错 −¥0.5。</p>
   <button class="btn" id="go">开始 (Enter)</button>`;
  $('go').onclick=startGame;
}
addEventListener('keydown',e=>{
  if(!F.on){ if(e.code==='Enter'||e.code==='Space'){ e.preventDefault(); startGame(); } return; }
  if(e.key>='1'&&e.key<='4') pick(+e.key-1);
});
intro();
</script>
</body>
</html>
