  刷单 (paid fake praise). Click the fakes within 45 s; wrong clicks cost 3 s and a little money.
  Label produced: review -> 刷单 / 真实. 灵光 reads the page too and outlines its suspects in purple, right as often as
  LG.skill() (and falsely accusing real reviews more often when it is weak).
  Pages are generated from banks: 6 products x 8 genuine reviews + 8 generic genuine ones, and 24 fake patterns.

// ---------- audio (tiny WebAudio beeps) ----------
let AC=null;
function beep(f,d=.08,type='sine',v=.05,f2){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=type;o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

// ---------- banks ----------

function dstr(ago,h,m){ const d=new Date(Date.UTC(2016,4,29)-ago*864e5); return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate())+' '+p2(h)+':'+p2(m); }
function dday(ago){ return dstr(ago,0,0).slice(0,10); }

  {why:'模板占位符没替换',mk:()=>[{t:'亲，这个{商品名}真的很不错，{评价内容}，下次还会光顾{店铺名}'}]},
  {why:'外文复制粘贴的刷手评价',mk:()=>[{t:'A+++++ seller, fast shipping, good item, thanks',def:true}]},
  {why:'“按卖家要求”写的好评',mk:()=>[{t:'按卖家要求给五星好评，附上十五个字以上的评价内容，谢谢'}]},
  {why:'三个连号昵称，同一天下单',n:3,mk:p=>{ const a=SAMEDAY(p),b=pick(['淘友','买家','happy']),T=shuffle(['不错，喜欢','很满意，好评','质量好，推荐']),s=rnd(80); return T.map((t,i)=>({t,ago:a,h:14+rnd(6),m:rnd(60),name:b+'***'+p2(s+i)})); }},
  {why:'硬凹的“推荐故事”',mk:()=>[{t:'已经推荐给三个同事，同事都说好，公司全买了，老板还夸我会买东西'}]},
  {why:'“零缺点”的不真实好评',mk:()=>[{t:'没有任何缺点！完美！完美！完美！强烈推荐给所有人！'}]},
];

// ---------- game state ----------
const PAGES=3, TIME=45, PEN=3;
let S=null, P=null, revs=[], tm=null, timers=[], used=[];

stage.innerHTML=`
<div id="zs">
  <div class="zs-top"><span class="lg">淘宝网<small>Taobao.com</small></span><span class="sr">搜索 宝贝 / 店铺</span><span class="ln">我的淘宝 ▾</span><span class="ln">🛒 购物车</span><span class="ln">★ 收藏夹</span></div>
  <div class="zs-main">
    <div class="zs-prod" id="zsProd"></div>
    <div class="zs-rv-wrap"><div class="zs-tabs" id="zsTabs"></div><div class="zs-grid" id="zsGrid"></div></div>
  </div>
  <div class="zs-bar">
    <div class="zs-tm"><i id="zsTmI"></i></div><span id="zsLeft">45.0</span>
    <span id="zsInfo">……</span>
    <button class="btn" id="zsNext" style="display:none">下一页 ▶</button>
  </div>
</div>
<div class="over" id="zsOver">
  <div class="big">🛒</div><h2>找水军</h2>
  <p>商品页上有 12 条评论，其中 3~5 条是刷单。<br>45 秒内把它们点出来；点错了扣 3 秒、扣一点钱。<br>紫色的框是灵光觉得可疑的，它不一定对——你点对了，它就学会了。</p>
  <button class="btn" id="zsGo" style="font-size:18px;padding:10px 40px">开始（回车）</button>
</div>`;

function buildPage(round){
  let pool=PRODUCTS.filter(x=>!used.includes(x)); if(!pool.length){ used=[]; pool=PRODUCTS.slice(); }
  const p=pick(pool); used.push(p);
  const nFake=[3,4,5][round]+(round===2&&Math.random()<.3?0:0);
  // fakes: add patterns until the quota is met
  let fakes=[]; for(const pat of shuffle(FK)){
    if(fakes.length>=nFake) break;
    const items=pat.mk(p); if(fakes.length+items.length>nFake) continue;
    items.forEach(o=>fakes.push(Object.assign({fake:true,why:pat.why,stars:5},o)));
  }
  // top up with single-review patterns if the random pass came up short
  for(const pat of shuffle(FK)){ if(fakes.length>=nFake) break; const it=pat.mk(p); if(it.length===1&&!fakes.some(f=>f.why===pat.why)) fakes.push(Object.assign({fake:true,why:pat.why,stars:5},it[0])); }
  // genuine
  const gpool=shuffle(p.good.concat(GENERIC_GOOD.slice(0,0)).concat(shuffle(GENERIC_GOOD).slice(0,3))).slice(0,12-fakes.length);
  const good=gpool.map(g=>{
    const ago=1+rnd(p.ago-2), hr=Math.random()<.05?rnd(2):8+rnd(16);
    const o={fake:false,t:g[0],stars:g[1],ago,h:hr,m:rnd(60)};
    if(g[2]){ o.add=g[2]; o.addAgo=Math.min(ago-1>0?1+rnd(ago-1):1,5+rnd(20)); }
    return o;
  });
  const list=shuffle(fakes.concat(good)).map((o,i)=>{
    const r=Object.assign({ago:SAMEDAY(p),h:8+rnd(15),m:rnd(60),name:gname()},o);
    r.def=r.def||(!r.fake&&Math.random()<.08);
    r.av=r.def?'👤':pick(AVAS);
    r.lv=r.fake?(Math.random()<.5?'❤':'❤❤'):'❤'.repeat(1+rnd(4));
    r.date=dstr(Math.max(1,r.ago),r.h,r.m);
    r.done=false; r.aiSus=false; r.idx=i;
    return r;
  });
  return {p,list,nFake:fakes.length};
}

function render(){
  const p=P.p;
  $('#zsProd').innerHTML=`
    <div class="zs-img">${p.emoji}</div>
    <div class="zs-pn">${p.name}</div>
    <div class="zs-pr"><small>¥</small>${p.price}<s>¥${p.old}</s></div>
    <div class="zs-meta">月销量 <b>${p.sales}</b> 笔<br>累计评价 <b>${p.total}</b><br>上架时间 <b>${dday(p.ago)}</b><br>${p.shop}<br>掌柜信誉 💎💎<br><span style="color:var(--ai)">本页刷单评论：<b id="zsLeftN">${P.nFake}</b> 条</span></div>
    <div class="zs-buy"><span>加入购物车</span><span>立刻购买</span></div>`;
  $('#zsTabs').innerHTML=`<span>全部评价 <b>${p.total}</b></span><span>好评 <b>98%</b></span><span>有图(${Math.round(parseInt(p.total.replace(',',''))/9)})</span><span>追评(${Math.round(parseInt(p.total.replace(',',''))/20)})</span><span style="margin-left:auto;color:#aaa">第 ${S.page+1}/${PAGES} 页</span>`;
  const g=$('#zsGrid'); g.innerHTML='';
  P.list.forEach(r=>{
    const e=document.createElement('div'); e.className='zs-rv'; r.el=e;
    const stars='★'.repeat(r.stars)+'<i>'+'★'.repeat(5-r.stars)+'</i>';
    e.innerHTML=`<div class="zs-av ${r.def?'def':''}">${r.av}</div><div>
      <div class="zs-l1"><span class="zs-nm">${r.name}</span><span class="zs-lv" style="color:#E33;font-size:9px">${r.lv}</span><span class="zs-st">${stars}</span><span class="zs-dt">${r.date}</span></div>
      <div class="zs-tx"></div>${r.add?`<div class="zs-ad">追评（${r.addAgo}天后）：</div>`:''}</div>
      <span class="zs-ai">灵</span><div class="zs-stamp"></div>`;
    e.querySelector('.zs-tx').textContent=r.t;
    if(r.add) e.querySelector('.zs-ad').textContent='追评（'+(r.addAgo===0?'当天':r.addAgo+'天后')+'）：'+r.add;
    e.onclick=()=>click(r);
    g.appendChild(e);
  });
}

const SAY_START=[
  '评论里有好多字，我只能凭感觉乱标……',
  '我先扫一遍，紫色框是我觉得可疑的。',
  '看出来了：这几条像是同一个模板刷出来的。',
];
function aiSweep(){
  const s=LG.skill(), step=520-380*s;
  LG.say(s<.4?SAY_START[0]:s<.7?SAY_START[1]:SAY_START[2]);
  P.list.forEach((r,i)=>{
    r.aiSus=r.fake?Math.random()<s:Math.random()<.02+.26*(1-s);
    timers.push(setTimeout(()=>{
      if(!S||P.list[i]!==r) return;
      r.el.classList.add('scan'); setTimeout(()=>r.el.classList.remove('scan'),step);
      if(r.aiSus&&!r.done){ r.el.classList.add('sus'); beep(660,.06,'triangle',.025); }
    },500+i*step));
  });
  timers.push(setTimeout(()=>{
    const n=P.list.filter(r=>r.aiSus).length;
    LG.say(n?`我标了 ${n} 条可疑的。${s<.4?'不过我没什么把握……':s<.7?'你来判断吧。':'应该八九不离十。'}`:'这页我没看出可疑的……是我眼神不好吗？');
  },500+12*step+250));
}

let left=TIME, combo=0, lastHit=0, active=false, pageEarn=0;
function startPage(){
  active=false; timers.forEach(clearTimeout); timers=[]; clearInterval(tm);
  P=buildPage(S.page); render();
  left=TIME; combo=0; lastHit=0; pageEarn=0; active=true;
  $('#zsNext').style.display='none';
  LG.set('sPage',(S.page+1)+'/'+PAGES); LG.set('sCombo','0');
  $('#zsInfo').textContent='点出刷单评论！点错扣 3 秒。';
  updTimer();
  aiSweep();
  const t0=performance.now(), base=left;
  tm=setInterval(()=>{ if(!active) return; const dt=(performance.now()-t0)/1000; left=Math.max(0,TIME-dt-S.pen); // penalties accumulate in S.pen
    if(left<=0) endPage(false); updTimer(); },100);
  S.pen=0;
}
function updTimer(){
  $('#zsLeft').textContent=left.toFixed(1); $('#zsLeft').classList.toggle('low',left<10);
  $('#zsTmI').style.width=(left/TIME*100)+'%';
  if(performance.now()-lastHit>6000&&combo){ combo=0; LG.set('sCombo','0'); }
}
function foundCount(){ return P.list.filter(r=>r.fake&&r.done).length; }

function click(r){
  if(!active||r.done) return;
  r.done=true;
  const el=r.el, nowT=performance.now();
  if(r.fake){
    combo=(nowT-lastHit<6000)?combo+1:1; lastHit=nowT;
    const bonus=Math.min(combo-1,3)*.5, pay=1+bonus;
    el.classList.remove('sus'); el.classList.add('fake'); el.querySelector('.zs-stamp').textContent='刷单 · '+r.why;
    LG.give(1,pay); S.found++; S.earn+=pay; pageEarn+=pay;
    LG.float(el,'+¥'+pay.toFixed(1)+(combo>1?'  连击×'+combo:''),'var(--red)');
    LG.hist('ok'); LG.set('sFound',S.found); LG.set('sCombo',combo); LG.set('sPay','¥'+S.earn.toFixed(1));
    beep(520+combo*70,.1,'square',.04,900+combo*70);
    $('#zsLeftN').textContent=P.nFake-foundCount();
    if(r.aiSus) LG.say(pick(['对！这条我也觉得是刷的。','嗯，我猜对了——记住了：'+r.why+'。']));
    else LG.say('这条我没看出来……原来是：'+r.why+'。记住了。');
    if(foundCount()===P.nFake) endPage(true);
  }else{
    S.pen+=PEN; S.wrong++; S.earn-=.5; combo=0; LG.set('sCombo','0');
    LG.give(0,-.5); LG.float(el,'冤枉好人  −3秒 −¥0.5','#999');
    el.classList.remove('sus'); el.classList.add('real'); el.querySelector('.zs-stamp').textContent='真实评论';
    LG.shake(el); LG.hist('no'); LG.set('sWrong',S.wrong); LG.set('sPay','¥'+S.earn.toFixed(1));
    beep(150,.18,'sawtooth',.05,90);
    if(r.aiSus){ LG.say('……原来这条是真的。我又标错了。'); S.aiCorrected++; LG.give(1,0); LG.hist('ai'); }
    else LG.say(pick(['这条是真的呀，手别抖。','真评论也有"物流很快"的，别一概而论。']));
  }
}

function endPage(cleared){
  if(!active) return; active=false; clearInterval(tm); timers.forEach(clearTimeout); timers=[];
  const missed=P.list.filter(r=>r.fake&&!r.done);
  missed.forEach(r=>{ r.el.classList.add('miss'); r.el.querySelector('.zs-stamp').textContent='漏了 · '+r.why; r.el.classList.remove('sus'); LG.hist('no'); });
  // 灵光's page score
  const tp=P.list.filter(r=>r.fake&&r.aiSus).length, fp=P.list.filter(r=>!r.fake&&r.aiSus).length;
  S.aiTP+=tp; S.aiFP+=fp; S.aiFake+=P.nFake;
  // real reviews that 灵光 wrongly flagged and the player left alone count as quiet corrections
  const quiet=P.list.filter(r=>!r.fake&&r.aiSus&&!r.done);
  quiet.forEach(r=>{ r.el.classList.remove('sus'); r.el.classList.add('real'); r.el.querySelector('.zs-stamp').textContent='真实评论'; });
  let msg='';
  if(cleared){
    const bonus=Math.min(4,Math.floor(left/5)*.5);
    if(bonus>0){ LG.give(0,bonus); S.earn+=bonus; LG.float($('#zsGrid'),'提前清完 +¥'+bonus.toFixed(1),'var(--gold)'); }
    S.cleared++; beep(660,.12,'triangle',.05,990); setTimeout(()=>beep(990,.2,'triangle',.05),120);
    msg=`全部找出！剩 ${left.toFixed(1)} 秒`+(bonus>0?`，提速奖励 ¥${bonus.toFixed(1)}`:'')+'。';
    LG.say(pick(['全找出来了。我学到几个套路。','你比我快多了——不过我也跟上一点了。']));
  }else{
    beep(180,.4,'sawtooth',.05,80);
    msg=`时间到，还有 ${missed.length} 条没找出来（橙色虚线）。`;
    LG.say(`漏了 ${missed.length} 条……我下次会记住它们的样子。`);
  }
  if(quiet.length){ LG.give(quiet.length,quiet.length*.5); S.earn+=quiet.length*.5; msg+=` 灵光误标了 ${quiet.length} 条真评论，你没点，也算纠正（+¥${(quiet.length*.5).toFixed(1)}）。`; for(let i=0;i<quiet.length;i++) LG.hist('ai'); }
  LG.set('sPay','¥'+S.earn.toFixed(1));
  $('#zsInfo').textContent=msg+` 灵光这页：抓到 ${tp}/${P.nFake}，误报 ${fp}。`;
  const nx=$('#zsNext'); nx.style.display=''; nx.textContent=(S.page+1<PAGES)?'下一页 ▶（回车）':'看成绩 ▶（回车）';
}

function nextPage(){
  if(S.page+1<PAGES){ S.page++; startPage(); }
  else finish();
}
function finish(){
  const acc=S.aiFake?Math.round(S.aiTP/S.aiFake*100):0;
  const ov=$('#zsOver'); ov.style.display='flex';
  ov.innerHTML=`<div class="big">${S.cleared===PAGES?'🏆':'🛒'}</div><h2>${S.cleared===PAGES?'水军一网打尽':'水军清理完毕'}</h2>
    <table>
      <tr><td>清完的页数</td><td>${S.cleared} / ${PAGES}</td></tr>
      <tr><td>找出的刷单评论</td><td>${S.found} / ${S.aiFake} 条</td></tr>
      <tr><td>冤枉的好人</td><td>${S.wrong} 条</td></tr>
      <tr><td>本局收入</td><td style="color:var(--red)">¥${S.earn.toFixed(1)}</td></tr>
      <tr><td><span class="tagai">灵光</span> 抓到刷单</td><td>${S.aiTP} / ${S.aiFake}（${acc}%），误报 ${S.aiFP} 条</td></tr>
    </table>
    <p>${LG.skill()<.4?'灵光：我连"好评返现"都要你教……':LG.skill()<.7?'灵光：复读机和返现我已经认得出来了。':'灵光：套路都见过了，下次我先来。'}</p>
    <button class="btn" id="zsAgain" style="font-size:16px;padding:9px 34px">再来一局（回车）</button>`;
  $('#zsAgain').onclick=startGame;
}
function startGame(){
  S={page:0,found:0,wrong:0,earn:0,pen:0,cleared:0,aiTP:0,aiFP:0,aiFake:0,aiCorrected:0};
  used=[];
  $('#zsOver').style.display='none';
  LG.set('sFound',0); LG.set('sWrong',0); LG.set('sPay','¥0'); const h=document.getElementById('lgHist'); if(h) h.innerHTML='';
  startPage();
}
$('#zsGo').onclick=startGame;
$('#zsNext').onclick=nextPage;
addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){
    e.preventDefault();
    if(!S||$('#zsOver').style.display!=='none'){ if(!S||$('#zsAgain')) startGame(); else startGame(); }
    else if($('#zsNext').style.display!=='none') nextPage();
  }
});
</script>
