<!--
  谁是卧底 (party game, 2015-16): 4 players - you, 灵光, 小周, 阿杰. Three share one word (civilians), one holds a similar
  word (the undercover). Each round everybody gives a one-line description, you tag every other description as 像我的词 /
  不像, then vote someone out. Undercover out = civilians win; if the undercover survives to 2 players, it wins.
  Labels produced: (word, description) -> same word as the speaker's or not, and the word-pair relation itself (近义词对).
  灵光's description is limited by LG.skill():  <35% only 「是」/「否」;  <62% one related word (sometimes off);
  <80% a short phrase (sometimes vague);  >=80% a good clue, and if it suspects it is the undercover it bluffs with
  the other side's description. 灵光's vote is evidence-based with probability skill, otherwise random.
  NPCs read the descriptions' hidden kinds (shared / side A / side B) and vote on mismatches; a speaker that says nothing
  informative (「是」, off-topic) also looks suspicious to them.
-->

  <p>你、灵光、小周、阿杰四个人：三人拿同一个词，<b>一人拿相近的另一个词</b>（卧底）。<br>每轮每人说一句话描述自己的词（不能直接说出来），你要判断每句话<b>像不像你的词</b>，然后投票揪出卧底。<br>如果你自己拿到的是卧底词，就藏好自己。<br>灵光的描述受它水平限制：水平低时它只会说「是」或「否」。</p>
  <button class="btn" id="ssGo" style="font-size:18px;padding:10px 40px">开始（回车）</button>
</div>`;
const board=$('#ssBoard'), ctl=$('#ssCtl');
$('#ssPeek').onclick=()=>$('#ssWord').classList.toggle('hide');
$('#ssWord').onclick=e=>{ if(e.target.id!=='ssPeek') $('#ssWord').classList.toggle('hide'); };

function ev(desc,side,pair){
  // +1 match, -1 mismatch, 0 neutral, from the point of view of a reader holding word on `side` (a|b)
  const k=desc.kind;
  if(k==='A'||k==='tA') return side==='a'?1:-1;
  if(k==='B'||k==='tB') return side==='b'?1:-1;
  if(k==='free'){
    const ha=pair.tA.some(t=>desc.text.includes(t)), hb=pair.tB.some(t=>desc.text.includes(t));
    if(ha&&!hb) return side==='a'?1:-1;
    if(hb&&!ha) return side==='b'?1:-1;
  }
  return 0;
}
const vague=d=>d.kind==='yesno'||d.kind==='noise'||(d.kind==='free'&&d.text.length<3);

/** Suspicion scores for a reader on `side`; higher = more likely the undercover. noise adds personality. */
function suspicion(reader,noise){
  const sc={}; let against=0;
  for(const q of G.P){ if(q===reader||!q.alive) continue;
    let s=0; for(const d of q.descs){ const e=ev(d,reader.side,G.pair); s-=e; if(e<0) against++; if(vague(d)) s+=.8; }
    sc[q.id]=s+Math.random()*noise;
  }
  // everybody else seems to disagree with me: probably I am the undercover, so shift blame at random
  const mism=[...G.P].filter(q=>q!==reader&&q.alive).reduce((a,q)=>a+q.descs.reduce((b,d)=>b+(ev(d,reader.side,G.pair)<0?1:0),0),0);
  return {sc,doubtSelf:mism>=2};
}

function buildSeats(){
  [...board.querySelectorAll('.ss-seat')].forEach(e=>e.remove());
  // order on the table: row 1 小周, 灵光; row 2 阿杰, 你
  ['zhou','ai','jie','me'].forEach(id=>{
    const p=G.P.find(x=>x.id===id);
    const e=document.createElement('div'); e.className='ss-seat'+(id==='ai'?' ai':''); e.id='seat-'+id; p.el=e;
    e.innerHTML=`<div class="ss-top"><span class="ss-av">${id==='ai'?LG.SPIDER:p.emoji}</span><b class="ss-nm">${p.name}</b><span class="ss-badge" style="display:none"></span><span class="ss-tally"></span></div><div class="ss-lines"></div><div class="ss-act"></div>`;
    board.appendChild(e);
  });
}
const seatLines=p=>p.el.querySelector('.ss-lines');
const seatAct=p=>p.el.querySelector('.ss-act');
function setPhase(t,tip){ $('#ssPh').textContent=t; $('#ssTip').textContent=tip||''; }
function panel(html){ ctl.innerHTML=html; return ctl; }
function addLine(p,d,typing){
  const L=seatLines(p); const div=document.createElement('div'); div.className='ss-ln'+(typing?' typing':'');
  div.innerHTML='<small>第 '+G.round+' 轮</small><span></span>'; div.querySelector('span').textContent=typing?'……':'「'+d.text+'」';
  L.appendChild(div); if(d) d.lineEl=div; return div;
}
function setNow(p){ G.P.forEach(q=>q.el.classList.toggle('now',q===p)); }

// ---------- describing ----------
const usedText=new Set();
const take=(arr)=>{ const f=arr.filter(t=>!usedText.has(t)); return pick(f.length?f:arr); };
function npcDescribe(p){
  const cfg=NPC[p.id], pair=G.pair, mine=p.side==='a'?'A':'B', other=p.side==='a'?'B':'A';
  const prior=G.P.filter(q=>q!==p&&q.alive).flatMap(q=>q.descs);
  const seen=prior.reduce((a,d)=>a+ev(d,p.side,pair),0);
  let kind;
  if(seen<0) kind=Math.random()<.8?'S':mine;                 // I think I'm odd one out: stay vague
  else kind=Math.random()<(.35+.45*cfg.bold)?mine:'S';
  const useTag=Math.random()<.25;
  const k=useTag?'t'+kind:kind;
  const text=take(pair[k]); usedText.add(text);
  return {text,kind:k};
}
function aiDescribe(p){
  const s=LG.skill(), pair=G.pair, mine=p.side==='a'?'A':'B', other=p.side==='a'?'B':'A';
  const prior=G.P.filter(q=>q!==p&&q.alive).flatMap(q=>q.descs);
  const seen=prior.reduce((a,d)=>a+ev(d,p.side,pair),0);
  if(s<.35){ return {text:pick(['是','否']),kind:'yesno'}; }
  if(s<.62){
    if(Math.random()<.12+(.62-s)*1.7){ return {text:pick(NOISE),kind:'noise'}; }
    const kind=pick(['tS','t'+mine,'t'+mine]); const text=take(pair[kind]); return {text,kind};
  }
  if(s<.8){
    if(Math.random()<.25){ const t=pick(PHRASE_NOISE); return {text:t,kind:'noise'}; }
    const kind=pick(['S',mine]); const text=take(pair[kind]); usedText.add(text); return {text,kind};
  }
  // strong: reads the room
  if(prior.length&&seen<0){            // the others sound unlike me: bluff with their side
    const text=take(pair[other]); usedText.add(text); return {text,kind:other,bluff:true};
  }
  const kind=(prior.length&&seen>0)?mine:'S'; const text=take(pair[kind]); usedText.add(text); return {text,kind};
}
function askDescribe(p){
  return new Promise(res=>{
    const pair=G.pair, mine=p.side==='a'?'A':'B';
    const sugs=shuffle([{kind:'S',text:take(pair.S)},{kind:mine,text:take(pair[mine])},{kind:'t'+(Math.random()<.5?'S':mine),text:null}]);
    sugs.forEach(x=>{ if(!x.text) x.text=take(pair[x.kind]); });
    // avoid duplicates inside the three chips
    const seen=new Set(); const chips=sugs.filter(x=>!seen.has(x.text)&&seen.add(x.text));
    panel(`<h4>轮到你描述</h4><div class="hint">用一句话描述你的词，但不能直接说出它。选一句，或自己写。</div>
      ${chips.map((c,i)=>`<button class="ss-chip" data-i="${i}"><kbd>${i+1}</kbd><span></span></button>`).join('')}
      <input type="text" id="ssIn" maxlength="20" placeholder="或者自己写，回车发送">
      <div class="hint" id="ssErr" style="color:var(--red)"></div>`);
    ctl.querySelectorAll('.ss-chip').forEach((b,i)=>{ b.querySelector('span').textContent=chips[i].text; b.onclick=()=>done(chips[i]); });
    const inp=$('#ssIn'); inp.focus();
    inp.onkeydown=e=>{ if(e.key==='Enter'&&inp.value.trim()){
        const t=inp.value.trim();
        if(t.includes(p.word)){ $('#ssErr').textContent='不能直接说出你的词！'; LG.shake(inp); beep(150,.15,'sawtooth'); return; }
        if(t.length<1) return; done({text:t,kind:'free'}); } };
    function done(d){ ctl.innerHTML=''; res(d); }
    G.chipKey=n=>{ if(chips[n-1]&&document.activeElement!==inp) done(chips[n-1]); };
  });
}

// ---------- marking & voting ----------
function askMarks(){
  return new Promise(res=>{
    const others=G.P.filter(q=>q.id!=='me'&&q.alive);
    const me=G.me;
    let n=0;
    others.forEach(q=>{
      const d=q.descs[q.descs.length-1]; const act=seatAct(q); act.innerHTML='';
      const b1=document.createElement('button'), b2=document.createElement('button');
      b1.textContent='👍 像我的词'; b2.textContent='🤔 不像';
      const set=(v,btn)=>{ const first=!d.mark; d.mark=v; b1.classList.toggle('on',v==='like'); b2.classList.toggle('on',v==='not');
        if(first){ n++; S.marks++; LG.give(1,0); LG.set('sMark',S.marks); LG.hist('ai','判'); beep(500,.05,'triangle'); upd(); }
        G.marks=G.marks.filter(m=>m.d!==d); G.marks.push({q,d,v}); };
      b1.onclick=()=>set('like'); b2.onclick=()=>set('not');
      act.appendChild(b1); act.appendChild(b2);
    });
    function upd(){ $('#ssMk').textContent=n+' / '+others.length; }
    panel(`<h4>标一标</h4><div class="hint">每个人的描述，<b>像你手里的词</b>还是<b>不像</b>？点卡片下面的按钮。答案在局末揭晓：对 +¥0.5，错 −¥0.2。</div>
      <div class="res">已标：<b id="ssMk">0 / ${others.length}</b></div>
      <div class="hint" id="ssAiRead"></div>
      <button class="btn" id="ssPrimary">标完了，去投票（回车）</button>`);
    // 灵光 gives a spoken reading of the table, accurate by skill
    const s=LG.skill();
    setTimeout(()=>{
      const el=$('#ssAiRead'); if(!el) return;
      const {sc}=suspicion(G.ai,.4); const real=Object.entries(sc).filter(([id])=>id!=='ai').sort((a,b)=>b[1]-a[1]);
      const pickId=(Math.random()<s&&real.length)?real[0][0]:pick(G.P.filter(q=>q.alive&&q.id!=='ai').map(q=>q.id));
      const nm=G.P.find(q=>q.id===pickId).name;
      const t=s<.4?`灵光：我感觉……${nm}？（我也不确定）`:s<.7?`灵光：我觉得 ${nm} 说得有点怪。`:`灵光：${nm} 的话和我们对不上，我怀疑 TA。`;
      el.textContent=t; LG.say(t.replace('灵光：',''));
      G.aiPick=pickId;
    },900+(1-s)*700);
    $('#ssPrimary').onclick=()=>{ others.forEach(q=>seatAct(q).innerHTML=''); res(); };
  });
}
function askVote(){
  return new Promise(res=>{
    const alive=G.P.filter(q=>q.alive), cands=alive.filter(q=>q.id!=='me');
    setPhase('投票','点击你要投出去的人');
    cands.forEach(q=>{
      const act=seatAct(q); act.innerHTML=''; const b=document.createElement('button'); b.className='vote'; b.textContent='投 '+q.name+'  ('+(cands.indexOf(q)+1)+')';
      b.onclick=()=>{ cands.forEach(c=>seatAct(c).innerHTML=''); res(q); }; act.appendChild(b);
    });
    G.voteKey=n=>{ if(cands[n-1]){ cands.forEach(c=>seatAct(c).innerHTML=''); res(cands[n-1]); } };
    panel(`<h4>投票</h4><div class="hint">谁的话对不上？点卡片上的红色按钮，或按数字键。</div>`);
  });
}

// ---------- the game ----------
async function play(){
  const id=++RUN; const chk=()=>{ if(RUN!==id) throw CANCEL; };
  try{
    const pair=pick(PAIRS), civSide=Math.random()<.5?'a':'b', ucSide=civSide==='a'?'b':'a';
    const ucIdx=rnd(4);
    const defs=[['me','你','😎'],['ai','灵光',''],['zhou','小周','🧑'],['jie','阿杰','🧢']];
    G={pair,P:defs.map((d,i)=>({id:d[0],name:d[1],emoji:d[2],under:i===ucIdx,side:i===ucIdx?ucSide:civSide,word:pair[(i===ucIdx?ucSide:civSide)],alive:true,descs:[]})),round:0,marks:[],aiPick:null};
    G.me=G.P[0]; G.ai=G.P[1];
    S={marks:0,desc:0,votes:0,earn:0,aiVoted:0,aiBluff:false,aiKinds:[]};
    usedText.clear();
    ['sRound','sDesc','sMark','sVote'].forEach(k=>LG.set(k,0)); LG.set('sPay','¥0'); const hs=document.getElementById('lgHist'); if(hs) hs.innerHTML='';
    $('#ssOver').style.display='none';
    buildSeats();
    $('#ssWordT').textContent=G.me.word; $('#ssWord').classList.remove('hide');
    setTimeout(()=>$('#ssWord').classList.add('hide'),3000);
    setPhase('发词','看一眼你的词，3 秒后会自动盖住（点击词牌再看）');
    const s0=LG.skill();
    LG.say(s0<.35?'我拿到词了。但我现在只会回答「是」或者「否」……':s0<.62?'我拿到词了，我只能说一个词来形容它。':s0<.8?'我拿到词了，我能说一句话。':'我拿到词了。放心，我会看风向的。');
    panel('<h4>发牌</h4><div class="hint">三个人拿同一个词，一个人拿相近的词。你们互相不知道谁是谁。</div>');
    await sleep(1800); chk();

    let winner=null, outPlayer=null;
    while(!winner){
      G.round++; LG.set('sRound',G.round); G.aiPick=null;
      $('#ssRound').textContent='第 '+G.round+' 轮';
      const alive=G.P.filter(q=>q.alive); const order=shuffle(alive);
      setPhase('描述');
      for(const p of order){
        chk(); setNow(p);
        let d;
        if(p.id==='me'){
          $('#ssTip').textContent='轮到你'; d=await askDescribe(p); chk();
          S.desc++; LG.set('sDesc',S.desc); LG.give(1,.5); S.earn+=.5; LG.set('sPay','¥'+S.earn.toFixed(1)); LG.hist('ok','说');
        }else{
          $('#ssTip').textContent=p.name+' 在想……';
          const ln=addLine(p,null,true);
          if(p.id==='ai'){ const s=LG.skill(); LG.say(s<.35?'……让我想想。（其实我只有两个选项）':s<.62?'嗯……找一个相关的词。':s<.8?'想一句话。':'先看看前面的人怎么说。'); }
          else LG.say(pick(NPC[p.id].lines)+'——'+p.name);
          await sleep(900+rnd(700)); chk();
          d=p.id==='ai'?aiDescribe(p):npcDescribe(p);
          ln.remove();
        }
        d.round=G.round; p.descs.push(d); addLine(p,d); beep(380+rnd(120),.08,'triangle',.04);
        if(p.id==='ai'){ S.aiKinds.push(d); if(d.bluff) S.aiBluff=true;
          LG.say(d.kind==='yesno'?'我说的是「'+d.text+'」。（我现在只能这样）':d.kind==='noise'?'「'+d.text+'」……好像说偏了。':d.bluff?'我说得像不像你们的词？':'我说完了。'); }
        await sleep(350); chk();
      }
      setNow(null);
      // marking
      setPhase('标一标','判断每句话像不像你的词');
      await askMarks(); chk();
      // voting
      const myVote=await askVote(); chk();
      setPhase('开票'); panel('<h4>开票</h4>');
      const votes={}; G.P.forEach(q=>votes[q.id]=0);
      const casts=[['me',myVote]];
      for(const v of alive.filter(q=>q.id!=='me')){
        const {sc,doubtSelf}=suspicion(v,v.id==='ai'?.2:(NPC[v.id].bold>.5?.9:.5));
        let tgt, note='';
        const others=alive.filter(q=>q!==v);
        if(v.id==='ai'){
          const s=LG.skill();
          if(Math.random()<s&&!doubtSelf){ tgt=others.sort((a,b)=>sc[b.id]-sc[a.id])[0]; }
          else if(Math.random()<s&&G.aiPick){ tgt=G.P.find(q=>q.id===G.aiPick)||pick(others); }
          else { tgt=pick(others); note='（随便选的）'; }
          if(!alive.includes(tgt)) tgt=pick(others);
        }else{
          tgt=doubtSelf?pick(others):others.sort((a,b)=>sc[b.id]-sc[a.id])[0];
        }
        casts.push([v.id,tgt,note]);
      }
      for(const [vid,tgt,note] of casts){
        chk(); await sleep(520);
        const voter=G.P.find(q=>q.id===vid); votes[tgt.id]++;
        const a=seatAct(voter); a.innerHTML='<span class="info">投给 <b>'+tgt.name+'</b> '+(note||'')+'</span>';
        tgt.el.querySelector('.ss-tally').textContent=votes[tgt.id]+' 票';
        beep(300,.06,'square',.04);
        if(vid==='ai') LG.say(note?'我投 '+tgt.name+'……'+note.replace(/[（）]/g,''):'我投 '+tgt.name+'。');
      }
      await sleep(700); chk();
      S.votes++; LG.set('sVote',S.votes);
      // resolve
      const max=Math.max(...Object.values(votes)); let tied=alive.filter(q=>votes[q.id]===max);
      const out=pick(tied); out.alive=false; outPlayer=out;
      out.el.classList.add('out');
      const bd=out.el.querySelector('.ss-badge'); bd.style.display=''; bd.textContent=out.under?'卧底':'平民'; bd.className='ss-badge '+(out.under?'uc':'cv');
      G.P.forEach(q=>seatAct(q).innerHTML='');
      // did the player vote correctly?
      const mineRight=myVote.under;
      if(mineRight){ LG.give(1,1.5); S.earn+=1.5; LG.hist('ok','票'); LG.float(G.me.el,'投中卧底 +¥1.5','var(--red)'); }
      else { LG.hist('no','票'); }
      const aiCast=casts.find(c=>c[0]==='ai'); if(aiCast&&aiCast[1].under) S.aiVoted++;
      LG.set('sPay','¥'+S.earn.toFixed(1));
      const alive2=G.P.filter(q=>q.alive);
      if(out.under) winner='civ';
      else if(alive2.length<=2) winner='uc';
      beep(out.under?700:200,.3,'sawtooth',.05,out.under?1200:90);
      const tie=tied.length>1?'（平票，随机一人出局）':'';
      panel(`<h4>${out.name} 出局${tie}</h4><div class="res">${out.name}是 <b style="color:${out.under?'var(--red)':'var(--green)'}">${out.under?'卧底':'平民'}</b>。${winner?'':'游戏继续。'}</div>
        <button class="btn" id="ssPrimary">${winner?'看结果（回车）':'下一轮（回车）'}</button>`);
      setPhase('出局');
      if(out.id==='ai') LG.say(out.under?'我是卧底……被你们揪出来了。':'我是平民……冤枉。');
      else if(out.id==='me'){ winner=winner||'me_out'; }
      await new Promise(r=>{ $('#ssPrimary').onclick=r; }); chk();
      if(out.id==='me'&&!winner) winner='me_out';
      if(winner==='me_out'||winner) break;
    }
    finish(winner);
  }catch(e){ if(e!==CANCEL) console.error(e); }
}

function finish(winner){
  // reveal all words
  G.P.forEach(q=>{ const L=seatLines(q); const d=document.createElement('div'); d.className='ss-ln'; d.innerHTML='<small>词</small><b></b>'; d.querySelector('b').textContent=q.word+(q.under?'（卧底词）':''); L.appendChild(d);
    const bd=q.el.querySelector('.ss-badge'); bd.style.display=''; bd.textContent=q.under?'卧底':'平民'; bd.className='ss-badge '+(q.under?'uc':'cv'); q.el.classList.remove('out'); seatAct(q).innerHTML=''; });
  // settle the markings against the truth
  let ok=0,no=0;
  G.marks.forEach(m=>{
    const same=m.q.side===G.me.side, right=(m.v==='like')===same;
    right?ok++:no++;
    const tag=document.createElement('span'); tag.className='tg '+(right?'y':'n'); tag.textContent=(m.v==='like'?'你标：像':'你标：不像')+(right?' ✓':' ✗');
    m.d.lineEl&&m.d.lineEl.appendChild(tag);
    LG.hist(right?'ok':'no',right?'✓':'✗');
  });
  const mpay=ok*.5-no*.2; if(ok||no){ LG.give(0,mpay); S.earn+=mpay; }
  let win;
  if(winner==='civ') win=!G.me.under; else if(winner==='uc') win=G.me.under; else win=false; // me_out: out is a loss
  const bonus=win?(G.me.under?8:5):0;
  if(bonus){ LG.give(0,bonus); S.earn+=bonus; }
  LG.set('sPay','¥'+S.earn.toFixed(1));
  const s=LG.skill();
  const aiRole=G.ai.under?'卧底':'平民';
  const ov=$('#ssOver'); ov.style.display='flex';
  const headline=winner==='me_out'?'你被投出去了':winner==='civ'?'卧底被揪出来了':'卧底活到了最后';
  ov.innerHTML=`<div class="big">${win?'🏆':'🕵️'}</div><h2>${win?'你赢了':'你输了'} · ${headline}</h2>
    <p>${G.pair.a} ／ ${G.pair.b}　卧底是 <b>${G.P.find(q=>q.under).name}</b>（${G.P.find(q=>q.under).word}），其余人拿到 <b>${G.P.find(q=>!q.under).word}</b>。</p>
    <table>
      <tr><td>你的判断</td><td>${ok} 对 / ${no} 错</td></tr>
      <tr><td>描述 / 投票</td><td>${S.desc} 句 / ${S.votes} 次</td></tr>
      <tr><td>胜利奖金</td><td>${bonus?'+¥'+bonus.toFixed(1):'—'}</td></tr>
      <tr><td>本局收入</td><td style="color:var(--red)">¥${S.earn.toFixed(1)}</td></tr>
      <tr><td><span class="tagai">灵光</span>（${aiRole}）的表现</td><td>${S.aiKinds.map(d=>'「'+d.text+'」').join(' ')||'—'}</td></tr>
    </table>
    <p class="rel">词语关系已记入：${G.pair.a} ≈ ${G.pair.b}（近义词对）${S.aiBluff?'　灵光这局装过：它其实知道自己的词和你们不一样':''}</p>
    <button class="btn" id="ssAgain" style="font-size:16px;padding:9px 34px">再来一局（回车）</button>`;
  $('#ssAgain').onclick=play;
  LG.say(s<.35?'我还是只会「是」和「否」……下次教我多说几个词。':s<.7?'我学到了一点：'+G.pair.a+'和'+G.pair.b+'要这样区分。':'这对词我记住了，下次我来带节奏。');
}
$('#ssGo').onclick=play;
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT') return;
  if(/^[1-9]$/.test(e.key)){ const n=+e.key; G&&G.chipKey&&ctl.querySelector('.ss-chip')&&G.chipKey(n); G&&G.voteKey&&ctl.textContent.includes('谁的话对不上')&&G.voteKey(n); return; }
  if(e.key==='Enter'||e.key===' '){
    const over=$('#ssOver');
    if(over.style.display!=='none'){ e.preventDefault(); play(); return; }
    const b=$('#ssPrimary'); if(b){ e.preventDefault(); b.click(); }
  }
});
</script>
</body>
