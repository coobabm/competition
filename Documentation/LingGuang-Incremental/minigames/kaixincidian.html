<!--
  开心辞典 (CCTV quiz show feel): 12 questions of rising difficulty (4 tiers x 3), 4 options, 15 s each, a prize ladder with
  safe points at question 4 and 8. Lifelines (once each): 求助灵光, 去掉两个错误答案, 换一题.
  Label produced: (question, option) -> right / wrong common-sense judgement; every answered question = 1 sample.
  求助灵光: 灵光 picks the right option with probability LG.skill() (minus 4% per difficulty tier). Its stated confidence is
  only loosely tied to being right, so a weak 灵光 is often wrong AND confident. After the reveal, if 灵光 was wrong, it
  says what the right answer was (that is the teaching moment).
  Money is settled at the end: wrong or timeout -> last safe point, 放弃 -> current prize, clear all 12 -> top prize.
-->

<div class="over" id="kxOver">
  <div class="big">🎤</div><h2>开心辞典</h2>
  <p>12 道常识题，每题 15 秒，难度越来越高，奖金一路上涨。<br>第 4、8 题是<b>安全点</b>：答错也能保住这里的奖金。<br>有三个求助机会：<b>求助灵光</b>、<b>去掉两个错误答案</b>、<b>换一题</b>。<br>灵光答得对不对，取决于它现在的水平——它的把握，也不一定靠谱。</p>
  <button class="btn" id="kxGo" style="font-size:18px;padding:10px 40px">上场（回车）</button>
</div>`;
const lad=$('#kxLad');
for(let i=0;i<12;i++){ const d=document.createElement('div'); d.className='kx-st'+(SAFE_AT.includes(i)?' safe':''); d.id='st'+i; d.innerHTML='<i>'+(i+1)+'</i><span>'+(SAFE_AT.includes(i)?'◆':'')+'</span><b>¥'+LADDER[i]+'</b>'; lad.appendChild(d); }
const host=t=>$('#kxHost').textContent='🎤 '+t;

function pickQ(diff){
  const pool=BANK[diff].filter(q=>!Q.used.has(q[0]));
  const q=pick(pool.length?pool:BANK[diff]); Q.used.add(q[0]);
  const opts=shuffle(q.slice(1).map((t,i)=>({t,ok:i===0})));
  return {text:q[0],opts,diff};
}
function showQ(){
  const q=Q.cur; $('#kxNo').textContent='第 '+(Q.n+1)+' 题 · ¥'+LADDER[Q.n]; $('#kxDif').textContent=DIFF_NAME[q.diff];
  $('#kxQT').textContent=q.text;
  const box=$('#kxOpts'); box.innerHTML='';
  q.opts.forEach((o,i)=>{ const b=document.createElement('button'); b.className='kx-op'; b.innerHTML='<b>'+LABEL[i]+'</b><span></span><span class="aitag">灵</span>';
    b.querySelector('span').textContent=o.t; b.onclick=()=>choose(i); o.el=b; o.gone=false; box.appendChild(b); });
  const ai=$('#kxAi'); ai.style.display='none'; ai.innerHTML='';
  for(let i=0;i<12;i++){ const e=$('#st'+i); e.classList.toggle('now',i===Q.n); e.classList.toggle('done',i<Q.n); }
  LG.set('sQ',(Q.n+1)+' / 12'); LG.set('sPrize','¥'+(Q.n?LADDER[Q.n-1]:0));
  Q.locked=false; Q.left=15; Q.aiPick=-1; updTimer();
}
function updTimer(){
  const t=$('#kxTm'); t.style.setProperty('--p',Q.left/15*100); $('#kxTmN').textContent=Math.ceil(Q.left);
  t.classList.toggle('low',Q.left<=5);
}
function startTimer(){
  clearInterval(tmr);
  tmr=setInterval(()=>{
    if(!Q||Q.locked||Q.over) return;
    Q.left=Math.max(0,Q.left-.1); updTimer();
    if(Q.left<=5&&Math.abs(Q.left-Math.round(Q.left))<.05) beep(880,.05,'square',.03);
    if(Q.left<=0){ clearInterval(tmr); timeout(); }
  },100);
}
function lockUI(on){ Q.locked=on; }

async function choose(i){
  if(!Q||Q.locked||Q.over) return; const o=Q.cur.opts[i]; if(o.gone) return;
  const id=RUN; lockUI(true);
  o.el.classList.add('sel'); host(pick(HOST.wait)); beep(440,.1,'triangle',.05);
  await sleep(1100); if(id!==RUN) return;
  await reveal(i);
}
async function timeout(){
  if(!Q||Q.over) return; lockUI(true); host('时间到！'); beep(120,.5,'sawtooth',.06,60); LG.shake($('#kxQ'));
  await sleep(600); await reveal(-1);
}
async function reveal(i){
  const id=RUN, q=Q.cur, rightI=q.opts.findIndex(o=>o.ok);
  q.opts[rightI].el.classList.remove('sel'); q.opts[rightI].el.classList.add('ok');
  const good=(i===rightI);
  if(i>=0&&!good){ q.opts[i].el.classList.remove('sel'); q.opts[i].el.classList.add('bad'); }
  Q.answered++; LG.give(1,0); LG.hist(good?'ok':'no',good?'✓':'✗');
  // 灵光 learns from the reveal if it was consulted
  if(Q.aiPick>=0){
    Q.aiRes++;
    if(Q.aiPick===rightI){ LG.say('灵光：看，我答对了，对吧。'); Q.aiOk++; LG.set('sAiOk',Q.aiOk); }
    else LG.say('灵光：……原来是「'+q.opts[rightI].t+'」，不是我选的那个。我记住了。');
  }
  if(good){
    Q.right++; LG.set('sOk',Q.right); beep(660,.12,'triangle',.06,990); setTimeout(()=>beep(990,.2,'triangle',.06),120);
    confetti(); host(pick(HOST.ok)+(SAFE_AT.includes(Q.n)?pick(HOST.safe):''));
    Q.n++; LG.set('sPrize','¥'+LADDER[Q.n-1]); LG.float({x:700,y:120},'¥'+LADDER[Q.n-1],'#FFD84A');
    await sleep(1500); if(id!==RUN) return;
    if(Q.n>=12){ return end('clear'); }
    Q.cur=pickQ(Math.floor(Q.n/3)+1); showQ(); startTimer();
  }else{
    host(pick(HOST.bad)+(i<0?'':'')); beep(130,.5,'sawtooth',.06,50); LG.shake($('#kxQ'));
    await sleep(1800); if(id!==RUN) return;
    end('fail');
  }
}
function confetti(){
  const k=$('#kx'); const cols=['#FFD84A','#FF6B6B','#6BCB77','#4D96FF','#C77DFF'];
  for(let j=0;j<26;j++){ const c=document.createElement('i'); c.className='kx-conf'; c.style.background=pick(cols); c.style.left=(120+rnd(600))+'px'; c.style.top=(60+rnd(40))+'px'; c.style.setProperty('--dx',(rnd(160)-80)+'px'); c.style.animationDelay=(rnd(300))+'ms'; k.appendChild(c); setTimeout(()=>c.remove(),1900); }
}

// ---------- lifelines ----------
function visible(){ return Q.cur.opts.map((o,i)=>({o,i})).filter(x=>!x.o.gone); }
function useAi(){
  if(!Q||Q.locked||Q.over||!Q.life.ai) return;
  Q.life.ai=false; $('#lfAi').disabled=true; Q.aiN++; LG.set('sAiN',Q.aiN);
  const s=LG.skill(), q=Q.cur, rightI=q.opts.findIndex(o=>o.ok);
  const p=Math.max(.1,s-.04*(q.diff-1));
  const vis=visible();
  const right=Math.random()<p;
  const pickI=right?rightI:pick(vis.filter(x=>x.i!==rightI)).i;
  // stated confidence is only loosely tied to being right
  const conf=right?Math.min(.98,.45+.4*s+Math.random()*.15):.3+Math.random()*.6;
  const box=$('#kxAi'); box.style.display='flex'; box.textContent='灵光思考中…'; Q.locked=true;
  LG.say(s<.4?'我想想……这题我也不太确定。':s<.7?'让我想想这个问题。':'我来看看。');
  const id=RUN;
  setTimeout(()=>{
    if(id!==RUN||Q.over) return; Q.locked=false; Q.aiPick=pickI;
    const L=LABEL[pickI];
    box.innerHTML='<span class="tagai">灵光</span><span>我选 <b>'+L+'</b>。'+(conf>.8?'把握很大！':conf>.55?'有点把握。':'……猜的。')+'</span><span class="cf"><i style="width:'+Math.round(conf*100)+'%"></i></span><b>'+Math.round(conf*100)+'%</b>';
    q.opts[pickI].el.classList.add('ai'); beep(700,.15,'triangle',.05);
    LG.say(conf>.8?'选 '+L+'！我很肯定。':conf>.55?'我倾向于 '+L+'。':'我猜是 '+L+'……');
  },1100+(1-s)*800);
}
function useFifty(){
  if(!Q||Q.locked||Q.over||!Q.life.fifty) return;
  Q.life.fifty=false; $('#lfFifty').disabled=true;
  const wrong=visible().filter(x=>!x.o.ok); shuffle(wrong).slice(0,2).forEach(x=>{ x.o.gone=true; x.o.el.classList.add('gone'); });
  host('好的，去掉两个错误答案。'); beep(520,.12,'square',.04,260);
}
function useSwap(){
  if(!Q||Q.locked||Q.over||!Q.life.swap) return;
  Q.life.swap=false; $('#lfSwap').disabled=true; host(pick(HOST.swap));
  Q.cur=pickQ(Q.cur.diff); const left=Q.left; showQ(); Q.left=left; updTimer(); beep(400,.12,'triangle',.05,700);
  LG.say('换题了。刚才那题我也没来得及看。');
}
function giveUp(){
  if(!Q||Q.locked||Q.over) return; if(Q.n===0){ host('还没答题，不能放弃哦。'); return; }
  end('quit');
}

function end(kind){
  Q.over=true; clearInterval(tmr);
  let prize;
  if(kind==='clear') prize=LADDER[11];
  else if(kind==='quit') prize=LADDER[Q.n-1];
  else prize=safeAmount(Q.n);
  if(prize) LG.give(0,prize);
  LG.set('sPrize','¥'+prize);
  const ov=$('#kxOver'); ov.style.display='flex';
  const title=kind==='clear'?'通关！开心辞典大奖':kind==='quit'?'见好就收':prize?'答错了，保住了安全点奖金':'答错了，空手而归';
  const s=LG.skill();
  ov.innerHTML=`<div class="big">${kind==='clear'?'🏆':kind==='quit'?'💰':'🎤'}</div><h2>${title}</h2>
    <table>
      <tr><td>答对题数</td><td>${Q.right} / 12</td></tr>
      <tr><td>最终奖金</td><td>¥${prize}</td></tr>
      <tr><td>提交的样本</td><td>${Q.answered} 条</td></tr>
      <tr><td><span class="tagai">灵光</span> 被求助</td><td>${Q.aiN?Q.aiN+' 次，答对 '+Q.aiOk+' / '+Q.aiRes+' 次':'没有被求助'}</td></tr>
    </table>
    <p>${Q.aiRes&&!Q.aiOk?'灵光：我一道都没答对……你可以教我吧。':Q.aiRes?'灵光：谢谢你信我，下次我会更靠谱。':Q.aiN?'灵光：你问了我又换题……我白想了一回。':'灵光：下次可以问问我嘛。'}（现在水平 ${Math.round(s*100)}%）</p>
    <button class="btn" id="kxAgain" style="font-size:16px;padding:9px 34px">再来一局（回车）</button>`;
  $('#kxAgain').onclick=start;
  LG.say(Q.aiRes?(Q.aiOk===Q.aiRes?'这次你问我的我都答对了！':'你问我的题里，我答错了 '+(Q.aiRes-Q.aiOk)+' 道，答案我都记下了。'):'这局你没怎么问我。我自己在旁边偷偷学。');
}

function start(){
  RUN++; clearInterval(tmr);
  Q={n:0,used:new Set(),life:{ai:true,fifty:true,swap:true},locked:true,over:false,left:15,right:0,answered:0,aiN:0,aiRes:0,aiOk:0,aiPick:-1,cur:null};
  ['lfAi','lfFifty','lfSwap'].forEach(i=>$('#'+i).disabled=false);
  ['sOk','sAiN','sAiOk'].forEach(k=>LG.set(k,0)); const hs=document.getElementById('lgHist'); if(hs) hs.innerHTML='';
  $('#kxOver').style.display='none';
  Q.cur=pickQ(1); showQ(); host(pick(HOST.start)); startTimer();
  const s=LG.skill();
  LG.say(s<.4?'常识题……我会的不多，但可以试试。':s<.7?'我可以帮你一道，别指望全对。':'我现在准备得挺充分，卡住了就问我。');
}
$('#kxGo').onclick=start;
$('#lfAi').onclick=useAi; $('#lfFifty').onclick=useFifty; $('#lfSwap').onclick=useSwap; $('#kxQuit').onclick=giveUp;
addEventListener('keydown',e=>{
  if(e.repeat) return;
  const over=$('#kxOver').style.display!=='none';
  if(over){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); start(); } return; }
  const k=e.key.toLowerCase();
  if(k.length===1&&'abcd'.includes(k)){ choose('abcd'.indexOf(k)); return; }
  if(/^[1-4]$/.test(k)){ choose(+k-1); return; }
  if(k==='z') useAi(); else if(k==='x') useFifty(); else if(k==='v') useSwap(); else if(k==='escape') giveUp();
});
</script>
</body>
</html>
