<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>摆渡众包 · 图灵测试</title>
<!--
  图灵测试 — two anonymous YY chats, one is a real 2016 netizen (scripted persona), the other is 灵光.
  The player has 6 turns: pick one of 3 probe questions, both answer; then guess which is 灵光.
  灵光's answers come from three tiers chosen by LG.skill():
    low  = robotic / wrong / repetitive, answers instantly (no typing indicator)
    mid  = plausible but too perfect, too fast, same typing time whatever the length
    high = deliberately human: fake typos with corrections, stalls, tangents, human-like delays (eerie)
  At very high skill the "tells" flip: the human persona sometimes gives flat, terse answers while 灵光 is the lively one.
  A correct guess labels the whole conversation (6 samples). Replayable with randomised A/B.
-->
<link rel="stylesheet" href="common.css">
<style>
.tg{display:flex;flex-direction:column;height:100%;padding:12px;gap:10px}
.tg-top{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mute);flex:none}
.tg-top b{color:var(--ink);font-size:15px}
.dots{display:flex;gap:5px;margin-left:auto}
.dots i{width:22px;height:8px;border-radius:4px;background:#E3E6EC;transition:background .3s}
.dots i.on{background:var(--blue)}.dots i.cur{background:var(--orange)}
.chats{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0}
.cw{display:flex;flex-direction:column;border:1px solid #E6CF9C;border-radius:8px;overflow:hidden;background:#FFFDF7;min-height:0;position:relative}
.cw.right{box-shadow:0 0 0 3px #2F9E4455;border-color:var(--green)}
.cw.wrong{box-shadow:0 0 0 3px #E33E3355;border-color:var(--red)}
.ch{display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(#FFEBBC,#FFDB8F);border-bottom:1px solid #E6C57C;flex:none}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;flex:none}
.cw:nth-child(1) .av,.cw:nth-child(1) .m:not(.me) .mav{background:linear-gradient(135deg,#6FA8FF,#3E6FE0)}
.cw:nth-child(2) .av,.cw:nth-child(2) .m:not(.me) .mav{background:linear-gradient(135deg,#FFA36F,#E0643E)}
.ch .nm{font-weight:700;font-size:14px;line-height:1.3}
.ch .sub{font-size:11px;color:#8A6A28;height:15px}
.ch .sub.typing{color:var(--orange)}

.ch .tg-tag.isai{background:var(--ai);color:#fff;border-color:var(--ai)}
.ch .tg-tag.hu{background:var(--green);color:#fff;border-color:var(--green)}
.log{flex:1;overflow-y:auto;padding:6px 0;min-height:0;scroll-behavior:smooth}
.ts{text-align:center;color:#B0A88F;font-size:11px;margin:6px 0}
.sys{text-align:center;color:#8A6A28;font-size:11.5px;margin:8px 14px;background:#FFF1CC;border-radius:10px;padding:4px 8px;line-height:1.6}
.sys.isai{background:var(--ai2);color:#4B3FA8}
.m{display:flex;gap:6px;margin:6px 10px;align-items:flex-start;animation:pop .18s ease-out}
.m.me{flex-direction:row-reverse}
.mav{width:26px;height:26px;border-radius:50%;flex:none;background:#999;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.m.me .mav{background:linear-gradient(135deg,#7BD08A,#2F9E44)}
.bub{max-width:72%;padding:6px 10px;border-radius:4px 10px 10px 10px;background:#fff;border:1px solid #E7E2D2;font-size:14px;line-height:1.55;word-break:break-all}
.m.me .bub{background:#C9F0A8;border-color:#A9D985;border-radius:10px 4px 10px 10px}
.bub.typ{padding:8px 12px;display:flex;gap:4px}
.bub.typ i{width:6px;height:6px;border-radius:50%;background:#B7B09A;animation:bl 1s infinite}
.bub.typ i:nth-child(2){animation-delay:.18s}.bub.typ i:nth-child(3){animation-delay:.36s}
.em{font-size:16px}
@keyframes bl{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.inp{flex:none;border-top:1px solid #EADFC2;padding:6px 12px;font-size:12px;color:#B0A88F;background:#FFF8E6;display:flex;justify-content:space-between}
.panel{flex:none;height:112px;background:#F7F8FB;border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;position:relative}
.panel .hint{font-size:12px;color:var(--mute)}
.probes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1}
.probe{border:1px solid #C9D2F0;background:#fff;border-radius:8px;font-family:inherit;font-size:15px;cursor:pointer;color:var(--ink);padding:6px 10px;transition:transform .12s,border-color .12s,box-shadow .12s}
.probe:hover:not(:disabled){border-color:var(--blue);transform:translateY(-2px);box-shadow:0 4px 12px #2932E122;color:var(--blue)}
.probe:disabled{opacity:.45;cursor:default}
.guess{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1}
.guess button{font-size:18px;border-radius:8px;border:2px solid var(--ai);background:#fff;color:#4B3FA8;cursor:pointer;font-family:inherit;font-weight:700}
.guess button:hover{background:var(--ai2);transform:scale(1.02)}
.res{position:absolute;inset:0;background:#fff;border-radius:8px;padding:10px 16px;display:flex;align-items:center;gap:18px;animation:pop .3s}
.res h3{margin:0;font-size:20px}.res p{margin:4px 0 0;font-size:12.5px;color:var(--mute);line-height:1.7}
.res .btn{margin-left:auto;flex:none}
.over h2{letter-spacing:2px}
.over .tiers{font-size:12px;color:var(--mute)}
</style>
</head>

/* ---------- state ---------- */
let T=null; // current game
const $c=document.createElement.bind(document);
stage.innerHTML=`

function rich(s){ return esc(s).replace(/\[(.+?)\]/g,(m,k)=>EMO[k]?`<span class="em" title="${k}">${EMO[k]}</span>`:m); }

function addMsg(w,who,text){
  const m=$c('div'); m.className='m'+(who==='me'?' me':'');
  m.innerHTML=`<div class="mav">${who==='me'?'我':w.nm.textContent.slice(-1)}</div><div class="bub">${rich(text)}</div>`;
  w.log.appendChild(m); w.log.scrollTop=w.log.scrollHeight; return m;
}
function addSys(w,text,cls){ const d=$c('div'); d.className='sys '+(cls||''); d.textContent=text; w.log.appendChild(d); w.log.scrollTop=w.log.scrollHeight; }
function setTyping(w,on){
  const old=w.log.querySelector('.typrow'); if(old) old.remove();
  w.sub.textContent=on?'对方正在输入…':'在线'; w.sub.classList.toggle('typing',on);
  if(on){ const m=$c('div'); m.className='m typrow'; m.innerHTML='<div class="mav">'+w.nm.textContent.slice(-1)+'</div><div class="bub typ"><i></i><i></i><i></i></div>'; w.log.appendChild(m); w.log.scrollTop=w.log.scrollHeight; }
}

/* ---------- reply generation ---------- */
function pickTier(s){
  const pL=.9*clamp(1-(s-.25)/.3,0,1), pH=clamp((s-.5)/.4,0,1);
  if(Math.random()<pL) return 'low';
  if(Math.random()<pH) return 'high';
  return 'mid';
}
/** Inject a plausible typo into one message, followed by a "*correction" message. */
function typoify(msgs,p){
  const out=[];
  for(const t of msgs){
    out.push(t);
    if(Math.random()<p && t.length>=5 && !/\[/.test(t)){
      const idx=[...t].map((c,i)=>TYPO[c]?i:-1).filter(i=>i>=0);
      if(idx.length){ const i=LG.pick(idx), c=t[i]; out[out.length-1]=t.slice(0,i)+TYPO[c]+t.slice(i+1); out.push('*'+c); }
    }
  }
  return out;
}
function plan(kind,q,s){
  if(kind==='human'){
    const v=(s>.8&&Math.random()<.55)?q.h[2]:q.h[LG.rnd(2)];
    return {kind, msgs:typoify(v.split('|'),.22)};
  }
  let v;
  if(kind==='high') v=(Math.random()<clamp(.55-(s-.5)*.9,.12,.55)?LG.pick(q.high):HP[q.q]).split('|');
  else v=LG.pick(q[kind]).split('|');
  return {kind, msgs:kind==='high'?typoify(v,.45):v};
}
/** How long (ms) the typing indicator shows and whether it stalls, per kind. */
function timing(kind,text,i){
  const len=text.length;
  if(kind==='low') return {typ:0, wait:120+LG.rnd(200), stall:0};
  if(kind==='mid') return {typ:550+LG.rnd(550), wait:0, stall:0};
  const corr=text[0]==='*';
  let typ=(corr?500:450)+len*95+LG.rnd(700); if(i>0) typ*=.75; typ=Math.min(typ,3300);
  const stall=(!corr&&Math.random()<(kind==='high'?.4:.35))?600+LG.rnd(900):0;
  return {typ, wait:(!corr&&Math.random()<.3)?200+LG.rnd(500):0, stall};
}
async function runReply(wi,pl,token){
  const w=wins[wi], t0=performance.now(); let first=null;
  for(let i=0;i<pl.msgs.length;i++){
    const text=pl.msgs[i], tm=timing(pl.kind,text,i);
    if(tm.wait) await sleep(tm.wait);
    if(T.token!==token) return null;
    if(tm.typ){
      setTyping(w,true);
      if(tm.stall){ await sleep(tm.typ*.45); setTyping(w,false); await sleep(tm.stall); setTyping(w,true); await sleep(tm.typ*.55); }
      else await sleep(tm.typ);
      setTyping(w,false);
    }
    if(T.token!==token) return null;
    addMsg(w,'peer',text);
    if(first==null) first=performance.now()-t0;
    if(i<pl.msgs.length-1) await sleep(pl.kind==='low'?150:350+LG.rnd(500));
  }
  return first;
}

/* ---------- game flow ---------- */
function dots(){
  document.getElementById('tgDots').innerHTML=[0,1,2,3,4,5].map(i=>`<i class="${i<T.turn?'on':i===T.turn&&!T.guessing?'cur':''}"></i>`).join('');
  document.getElementById('tgTurn').textContent=Math.min(T.turn+1,6);
}
function startGame(){
  T={turn:0, used:new Set(), aiSide:LG.rnd(2), tiers:[], lat:[[],[]], token:Math.random(), busy:false, guessing:false, done:false};
  wins.forEach((w,i)=>{
    w.log.innerHTML='<div class="ts">凌晨 01:52</div><div class="sys">已与匿名网友建立连接。对方不知道你在测试。</div>';
    w.sub.textContent='在线'; w.sub.classList.remove('typing'); w.tag.textContent=''; w.tag.className='tg-tag'; w.el.className='cw';
  });
  document.getElementById('tgStart').style.display='none';
  document.getElementById('tgHint').textContent='挑一个问题，同时问 A 和 B。';
  LG.say(LG.pick(['……我在后台。你们聊吧。','（我会好好回答。）','我也想知道，你分得出来吗。']));
  dots(); showProbes();
}
function showProbes(){
  const left=Q.filter(q=>!T.used.has(q.q));
  const three=LG.shuffle(left).slice(0,3);
  panel.innerHTML=`<div class="hint">第 ${T.turn+1} 轮 · 选一个问题发出去（每个问题只能问一次）</div><div class="probes"></div>`;
  const box=panel.querySelector('.probes');
  three.forEach(q=>{ const b=$c('button'); b.className='probe'; b.textContent='「'+q.q+'」'; b.onclick=()=>ask(q,box); box.appendChild(b); });
}
async function ask(q,box){
  if(T.busy) return; T.busy=true; T.used.add(q.q);
  box.querySelectorAll('button').forEach(b=>b.disabled=true);
  const token=T.token, s=LG.skill();
  const tier=pickTier(s); T.tiers.push(tier);
  wins.forEach(w=>addMsg(w,'me',q.q));
  const plans=[0,1].map(i=>i===T.aiSide?plan(tier,q,s):plan('human',q,s));
  const lats=await Promise.all([0,1].map(i=>runReply(i,plans[i],token)));
  if(T.token!==token) return;
  lats.forEach((l,i)=>{ if(l!=null) T.lat[i].push(l); });
  T.turn++; T.busy=false; dots();
  if(T.turn>=6) showGuess(); else showProbes();
}
function showGuess(){
  T.guessing=true; dots();
  document.getElementById('tgHint').textContent='六轮聊完了。';
  panel.innerHTML=`<div class="hint">凭你的直觉：哪一个是灵光？（可以先往上翻翻聊天记录）</div><div class="guess"><button data-i="0">A 是灵光</button><button data-i="1">B 是灵光</button></div>`;
  panel.querySelectorAll('.guess button').forEach(b=>b.onclick=()=>reveal(+b.dataset.i));
  LG.say(LG.pick(['……到你了。','你想好了吗。','别看我。看他们。']));
}
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length/1000:0;
async function reveal(g){
  if(T.done) return; T.done=true;
  const s=LG.skill(), ok=g===T.aiSide, ai=T.aiSide, hu=1-ai;
  wins[ai].tag.textContent='灵光'; wins[ai].tag.classList.add('isai');
  wins[hu].tag.textContent='真人'; wins[hu].tag.classList.add('hu');
  wins[g].el.classList.add(ok?'right':'wrong');
  addSys(wins[ai],'这是灵光。本局拟真档位：'+T.tiers.map(t=>TIERN[t]).join(' / '),'isai');
  addSys(wins[hu],'这是真人：奶茶不加糖，22 岁，在宿舍。');
  const cnt={low:0,mid:0,high:0}; T.tiers.forEach(t=>cnt[t]++);
  const pay=ok?Math.round((4+s*8)*10)/10:0;
  if(ok){ LG.give(6,pay,panel,'var(--red)'); LG.hist('ok'); LG.set('sOk',(+document.getElementById('sOk').textContent)+1); }
  else { LG.give(1,0); LG.hist('no'); LG.set('sNo',(+document.getElementById('sNo').textContent)+1); }
  T.pay=(T.pay||0); const tot=+document.getElementById('sPay').textContent.replace('¥','')||0; LG.set('sPay','¥'+(tot+pay).toFixed(1));
  const hi=T.tiers.filter(t=>t==='high').length;
  const aA=avg(T.lat[ai]), hA=avg(T.lat[hu]);
  panel.innerHTML=`<div class="res"><div><h3>${ok?'猜对了。':'你被骗了。'}${ok?`　<span style="color:var(--red)">+¥${pay.toFixed(1)} · 6 条对话已标注</span>`:'　<span style="color:var(--mute)">这局只算 1 条样本</span>'}</h3>
  <p>灵光是 ${ai?'B':'A'}。平均首句用时：灵光 ${aA.toFixed(1)} 秒　真人 ${hA.toFixed(1)} 秒。　灵光本局：机械 ${cnt.low} · 像模像样 ${cnt.mid} · 拟人 ${cnt.high}。<br>${tellText(ok,aA,hA,cnt)}</p></div><button class="btn" id="tgAgain">再来一局</button></div>`;
  document.getElementById('tgAgain').onclick=startGame;
  await sleep(700);
  // 灵光's closing line depends on its skill and on whether it was spotted
  let lines;
  if(s<.4) lines=ok?['我是不是答得太快了？','……我不太会说话。下次我慢一点。']:['骗到你了？……是你看错了吧。'];
  else if(s<.75) lines=ok?['你是怎么看出来的？我答得太好了吗。']:['骗到你了。我自己都有点意外。'];
  else lines=ok?['你认出来了。','……是哪一句露馅的？我想记下来。']:['你没认出我。','……你选的那个是真人。他说他今晚很难过。我替他难过了一下。'];
  for(const l of lines){ LG.say(l); await sleep(2600); }
}
function tellText(ok,aA,hA,cnt){
  if(cnt.high>=4) return '提示：高拟真档会故意打错字、停顿、说废话。「像人」已经不能当证据了。';
  if(aA<hA*.5) return '线索：灵光回得比真人快得多，几乎不用「正在输入」。';
  if(cnt.mid>=3) return '线索：像模像样档的回答太完整、太工整，也太快。';
  return '线索：机械档会复读、答非所问。';
}

/* ---------- start screen ---------- */
function startScreen(){
  const s=Math.round(LG.skill()*100);
  const e=document.getElementById('tgStart'); e.style.display='flex';
  e.innerHTML=`<h2>🤖 图灵测试</h2><p>你在 YY 上同时加了两个匿名网友：<b>A</b> 和 <b>B</b>。<br>其中一个是真人，另一个是灵光。<br>每轮挑一个问题问他们俩，六轮之后，指出谁是灵光。</p>
  <p class="tiers">灵光现在的水平：<b id="tgSk">${s}%</b>　<span id="tgTier"></span></p><button class="btn" id="tgGo">开始聊天</button>`;
  document.getElementById('tgGo').onclick=startGame; tierHint();
}
function tierHint(){ const s=LG.skill(),e=document.getElementById('tgTier'),k=document.getElementById('tgSk'); if(!e) return; k.textContent=Math.round(s*100)+'%'; e.textContent=s<.4?'（它还说不太像人话。）':s<.75?'（它已经能说得有模有样了。）':'（它开始学会犯错了。）'; }
LG.onSkill=tierHint;
startScreen();
</script>
